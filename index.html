<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* Telegram layer: native haptics, progress saved in Telegram's cloud (works on every device), share and send-to-top.
   The game below already knows two "native shell" plug-ins (Haptics, Preferences): here Telegram plays their role. */
(function(){
  var W=window.Telegram&&Telegram.WebApp, X=window.TGX={on:false,kb:false,bot:'trueblocks_puzzle_bot'};
  try{
    if(!W||!W.platform||W.platform==='unknown') return;
    X.on=true;
    var q=new URLSearchParams(location.search);
    X.kb=q.get('k')==='1';                       // opened from the bot's keyboard button: sendData() works
    if(/^\w{3,40}$/.test(q.get('b')||'')) X.bot=q.get('b');
    W.ready(); W.expand();
    if(W.disableVerticalSwipes) W.disableVerticalSwipes();
    ['setHeaderColor','setBackgroundColor','setBottomBarColor'].forEach(function(m){ try{ if(W[m]) W[m]('#080a0f'); }catch(e){} });
    var ge=function(v){ try{ return W.isVersionAtLeast(v); }catch(e){ return false; } };
    var HF=W.HapticFeedback&&ge('6.1')?W.HapticFeedback:null, CS=W.CloudStorage&&ge('6.9')?W.CloudStorage:null, Pl={};
    if(HF) Pl.Haptics={impact:function(o){ try{ HF.impactOccurred(String((o&&o.style)||'light').toLowerCase()); }catch(e){} }};
    if(CS){
      var K=function(k){ return String(k).replace(/[^\w-]/g,'_'); }, CH=3000, pend=null, tmr=0, busy=false;
      var setI=function(k,v){ return new Promise(function(r){ try{ CS.setItem(k,v,function(){ r(); }); }catch(e){ r(); } }); };
      var getI=function(k){ return new Promise(function(r){ try{ CS.getItem(k,function(e,v){ r(e?'':(v||'')); }); }catch(e){ r(''); } }); };
      var write=function(){
        if(busy||pend===null) return;
        var o=pend; pend=null; busy=true;
        var v=o.v, n=Math.max(1,Math.ceil(v.length/CH)), a=[];
        for(var i=0;i<n;i++) a.push(setI(K(o.k)+'_'+i,v.slice(i*CH,(i+1)*CH)));
        Promise.all(a).then(function(){ return setI(K(o.k)+'_n',String(n)); }).then(function(){ busy=false; if(pend!==null) write(); });
      };
      Pl.Preferences={
        set:function(o){ pend={k:o.key,v:String(o.value)}; clearTimeout(tmr); tmr=setTimeout(write,4000); return Promise.resolve(); },
        get:function(o){
          return getI(K(o.key)+'_n').then(function(n){
            n=parseInt(n,10); if(!(n>0&&n<200)) return {value:null};
            var a=[]; for(var i=0;i<n;i++) a.push(getI(K(o.key)+'_'+i));
            return Promise.all(a).then(function(p){ return {value:p.join('')}; });
          });
        }
      };
      X.flush=function(){ clearTimeout(tmr); write(); };
      document.addEventListener('visibilitychange',function(){ if(document.hidden) X.flush(); });
      window.addEventListener('pagehide',X.flush);
    }
    X.share=function(text){
      var u='https://t.me/'+X.bot;
      try{ W.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(u)+'&text='+encodeURIComponent(text)); }catch(e){}
    };
    X.submit=function(o){ try{ W.sendData(JSON.stringify(o)); }catch(e){} };
    window.Capacitor={Plugins:Pl};
  }catch(e){}
})();
</script>

<style>
:root{
  color-scheme:dark;
  --bg:#080a0f;--bg2:#10141d;--card:#151a25;--card2:#1c2331;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --ink:#f4f6fb;--muted:#8f99ad;--dim:#5d6678;
  --gold:#ffc83d;--gold2:#ff9a1f;--gold-ink:#2a1700;--good:#5be3a1;--bad:#ff6b7d;
  --well:#0b0e14;--board1:#1a2030;--board2:#10141d;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --cell:40px;--tcell:20px;--bw:340px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;position:relative;background:var(--bg);color:var(--ink);font:500 15px/1.3 var(--font);
  background-image:radial-gradient(120% 55% at 50% -8%,#1b2540 0%,transparent 62%),radial-gradient(90% 40% at 50% 112%,#1a1226 0%,transparent 70%);
  background-repeat:no-repeat;background-attachment:fixed;overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
svg{display:block}
.fxc{position:fixed;left:0;top:0;z-index:60;pointer-events:none}
#app{position:fixed;inset:0;z-index:1}
body{background-image:none}
.view{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  padding-top:max(8px,var(--sat));padding-bottom:max(12px,var(--sab));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  animation:viewin .35s ease both}
.scroll{overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* ---------- controls ---------- */
.icbtn{flex:none;width:42px;height:42px;border:0;border-radius:50%;padding:0;display:grid;place-items:center;color:var(--ink);cursor:pointer;
  background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--line);transition:transform .12s,background .15s}
.icbtn:active{transform:scale(.92);background:rgba(255,255,255,.12)}
.cta{border:0;border-radius:16px;min-height:52px;padding:0 22px;font:700 17px var(--font);color:var(--gold-ink);cursor:pointer;
  background:linear-gradient(180deg,#ffd75e,var(--gold2));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 18px -6px rgba(255,170,30,.6);transition:transform .12s}
.cta:active{transform:scale(.97)}
.cta.wide{width:100%}
.ghostbtn{border:0;border-radius:14px;min-height:46px;padding:0 18px;font:600 15px var(--font);color:var(--ink);cursor:pointer;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px var(--line);transition:transform .12s,background .15s}
.ghostbtn:active{transform:scale(.97);background:rgba(255,255,255,.14)}
.ghostbtn.danger{color:var(--bad)}
.linkbtn{border:0;background:none;padding:6px 10px;color:var(--muted);font:600 14px var(--font);cursor:pointer}
.linkbtn:active{color:var(--ink)}
.textbtn{border:0;background:none;color:var(--gold);font:700 15px var(--font);padding:8px 4px;cursor:pointer;justify-self:end}
.row{display:flex;gap:10px;width:100%}
.row>*{flex:1}
.sw{position:relative;flex:none;width:52px;height:32px;border:0;border-radius:16px;padding:0;background:#2b3345;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.4);transition:transform .2s}
.sw[aria-checked=true]{background:#34c77b}
.sw[aria-checked=true]::after{transform:translateX(20px)}
.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,.07)}
.seg button{flex:1;border:0;border-radius:9px;min-height:36px;padding:0 8px;background:none;color:var(--muted);font:600 14px var(--font);cursor:pointer}
.seg button[aria-pressed=true]{background:#313a4f;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.4)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;margin:2px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:#2b3345}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:#2b3345}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9.5px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff}
.field{width:100%;height:46px;border:0;border-radius:12px;padding:0 14px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font:600 16px var(--font);outline:none;-webkit-user-select:text;user-select:text}
.field:focus{box-shadow:inset 0 0 0 2px var(--gold)}

/* ---------- home ---------- */
.homebar{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;min-height:44px;flex:none}
.rankchip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px 0 10px;border-radius:16px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--line);font:700 13px var(--font);color:var(--ink);border:0}
.rankchip svg{color:var(--gold)}
.homebody{flex:1;min-height:0;width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:4px 0 10px}
.brand{text-align:center;line-height:1}
.brand h1{margin:0;font:800 clamp(40px,13.4vw,60px)/1 var(--disp);letter-spacing:-.045em;white-space:nowrap}
.brand h1 .a{font-weight:300;color:#cbd3e4;letter-spacing:-.035em}
.brand h1 .b{background:linear-gradient(180deg,#fff 10%,#ffd9a0 60%,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(255,170,60,.28))}
.shelf{display:flex;gap:7px;justify-content:center;padding:8px 6px;--cell:min(44px,10.4vw);--cs:var(--cell)}
.shelf .cell{flex:none;cursor:pointer}
.goalcard{width:100%;padding:15px 16px 14px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.035));box-shadow:inset 0 0 0 1px var(--line),0 12px 30px -16px rgba(0,0,0,.8)}
.gc-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px}
.gc-t{font:700 12px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.gc-n{font:800 22px var(--disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--gold)}
.gbar{position:relative;height:10px;border-radius:5px;background:rgba(0,0,0,.45);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.gbar>i{position:absolute;left:0;top:0;bottom:0;width:var(--v,0%);min-width:10px;border-radius:5px;background:linear-gradient(90deg,#ff9a1f,#ffd75e);box-shadow:0 0 12px rgba(255,190,60,.55);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.gbar>u{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:rgba(255,255,255,.28);border-radius:1px;text-decoration:none}
.gbar>u.on{background:#fff;box-shadow:0 0 6px #fff}
.gc-line{margin-top:11px;font:600 14px/1.35 var(--font);color:#d6dbe8}
.gc-line b{color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
.gc-ms{position:relative;height:14px;margin:10px 4px 0;font:700 11px var(--font);color:var(--dim);font-variant-numeric:tabular-nums}
.gc-ms span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.gc-ms span:last-child{transform:translateX(-100%)}
.gc-ms span.on{color:var(--gold)}
.homedock{flex:none;width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:4px}
.bigplay{position:relative;width:100%;min-height:104px;border:0;border-radius:26px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;text-align:left;cursor:pointer;color:var(--gold-ink);overflow:hidden;
  background:linear-gradient(180deg,#ffe07a 0%,#ffbd2e 55%,#ff9a1f 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -4px 0 rgba(160,70,0,.35),0 14px 34px -10px rgba(255,160,30,.7),0 2px 0 #7a3b00;transition:transform .12s}
.bigplay::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);transform:translateX(-120%);animation:shine 4.5s ease-in-out 1.2s infinite;pointer-events:none}
.bigplay:active{transform:scale(.98)}
.bp-t{display:block;font:800 32px/1.05 var(--disp);letter-spacing:-.03em}
.bp-s{display:block;margin-top:5px;font:700 14px var(--font);opacity:.7;font-variant-numeric:tabular-nums}
.bp-ic{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(42,23,0,.14);box-shadow:inset 0 0 0 2px rgba(42,23,0,.22)}
.row2{display:flex;gap:10px;width:100%}
.secbtn{flex:1;min-height:56px;border:0;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:9px;font:700 16px var(--font);cursor:pointer;
  background:rgba(255,255,255,.075);box-shadow:inset 0 0 0 1px var(--line);transition:transform .12s,background .15s}
.secbtn:active{transform:scale(.97);background:rgba(255,255,255,.13)}
.secbtn svg{opacity:.85}

/* ---------- game ---------- */
.top{width:100%;max-width:520px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px;flex:none;min-height:46px}
.score{text-align:center;line-height:1;min-width:0}
.num{display:block;font:800 36px/1 var(--disp);letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:#fff;white-space:nowrap;transform-origin:center bottom}
.num.bump{animation:bump .32s ease-out}
.score small{display:block;margin-top:3px;font:600 12px var(--font);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.play{flex:1;min-height:0;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding-top:4px}
.goal{width:var(--bw);flex:none}
.goal .gbar{height:7px}
.goal .gbar>i{min-width:7px}
.goal-t{display:flex;justify-content:space-between;margin-top:5px;font:600 12px var(--font);color:var(--muted);font-variant-numeric:tabular-nums}
.goal-t b{color:var(--gold);font-weight:700}
.status{flex:none;width:var(--bw);height:46px;display:flex;align-items:center;justify-content:center;position:relative}
.hint{font:600 14px/1.2 var(--font);color:#c9d0df;text-align:center;padding:0 6px}
.hint.alert{color:var(--gold);font-weight:700}
.combo{display:none;align-items:center;gap:10px;--ck:0;--cs:15px;font:900 min(var(--cs),40px)/1 var(--disp);letter-spacing:-.01em;white-space:nowrap;
  color:hsl(calc(52 - var(--ck)*40),100%,calc(90% - var(--ck)*32%));
  text-shadow:0 0 calc(2px + var(--ck)*16px) hsla(calc(42 - var(--ck)*32),100%,55%,calc(.25 + var(--ck)*.6)),0 2px 0 rgba(0,0,0,.35);transition:font-size .3s cubic-bezier(.3,1.6,.5,1),color .4s}
.combo.on{display:flex}
.combo .pips{display:flex;align-items:center}
.combo.pulse .cw{animation:cpulse .42s cubic-bezier(.3,1.7,.5,1)}
.combo.hot .cw{animation:cwob 1.6s ease-in-out infinite}
.combo.hot.pulse .cw{animation:cpulse .42s cubic-bezier(.3,1.7,.5,1)}
.combo.fire .cw{text-shadow:0 0 10px #ff8a1a,0 0 26px rgba(255,80,0,.75),0 0 2px #fff3c0}
/* molten metal from combo 50: white-hot core, flowing orange, a heat shimmer */
.combo.molten .cw{color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(100deg,#fffbe6 0%,#ffe08a 14%,#ff9a1f 28%,#d93300 40%,#ff7a12 52%,#fff1b8 64%,#ffc54a 76%,#e84800 88%,#fffbe6 100%);background-size:240% 100%;
  -webkit-text-stroke:.6px rgba(255,236,190,.55);text-shadow:none;
  filter:drop-shadow(0 0 2px rgba(255,200,120,.9)) drop-shadow(0 0 10px rgba(255,90,0,.75)) drop-shadow(0 0 26px rgba(255,40,0,.45));
  animation:molten 1.8s linear infinite,cwob 1.2s ease-in-out infinite}
.combo.molten .pip.on{background:#fff2c0;box-shadow:0 0 8px #ff8a14,0 0 16px #ff4a00}
.combo-gone{position:absolute;left:50%;top:50%;font:900 22px var(--disp);color:#8f99ad;transform:translate(-50%,-50%);animation:gone .9s ease-out forwards;pointer-events:none}
.pip{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3b4458;margin-left:3px}
.pip.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.breath{position:absolute;inset:0;display:grid;place-items:center;font:600 14px var(--font);color:#9fb2d6;letter-spacing:.04em;pointer-events:none}
.breath span{grid-area:1/1;opacity:0}
.breath .bi{animation:bin 8s ease-in-out infinite}.breath .bo{animation:bout 8s ease-in-out infinite}

.boardwrap{position:relative;width:var(--bw);flex:none;--heat:0}
.boardwrap.shake{animation:shake .34s linear}
.board{position:relative;display:grid;grid-template-columns:repeat(7,var(--cell));grid-auto-rows:var(--cell);gap:3px;padding:7px;border-radius:22px;
  background:linear-gradient(160deg,var(--board1),var(--board2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.04),0 24px 40px -18px rgba(0,0,0,.9),0 0 calc(8px + 40px*var(--heat)) rgba(255,190,60,calc(.32*var(--heat)));
  transition:box-shadow .5s}
.zen .board{animation:breathe 8s ease-in-out infinite}

.cell{--cs:var(--cell);--r:.2;position:relative;width:var(--cell);height:var(--cell);border-radius:calc(var(--cs)*.2);
  background:var(--well);box-shadow:inset 0 2px 4px rgba(0,0,0,.75),inset 0 -1px 0 rgba(255,255,255,.05)}
.cell.alt{background:#0e1219}
.cell.f,.cell.ghost{background-color:transparent;background-size:100% 100%;background-repeat:no-repeat;background-position:center;border-radius:calc(var(--cs)*var(--r))}
.cell.f{box-shadow:0 calc(var(--cs)*.07) calc(var(--cs)*.09) rgba(0,0,0,.55)}
.cell.ghost{opacity:.58;box-shadow:none}
.m0{--r:.27}.m1{--r:.16}.m2{--r:.15}.m4{--r:.15}
/* slime wobbles, gems catch the light, neon breathes */
.cell.f.m0{animation:jig var(--jt,4s) ease-in-out var(--jd,0s) infinite}
.cell.f.m2::after{content:"";position:absolute;inset:6%;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%) no-repeat;background-size:260% 100%;background-position:160% 0;
  mix-blend-mode:overlay;animation:sheen 7s ease-in-out var(--jd,0s) infinite}
.cell.f.m4{z-index:3;overflow:visible;animation:npulse 1.7s ease-in-out infinite}
.cell.f.m4::before,.piece .blk.m4::before,.shelf .cell.m4::before{content:"";position:absolute;inset:-70%;border-radius:50%;pointer-events:none;z-index:-1;
  background:radial-gradient(circle,var(--nc,#18f0ff) 0%,transparent 62%);opacity:.5;mix-blend-mode:screen;animation:nhalo 1.7s ease-in-out infinite}
.m4.c0{--nc:#18f0ff}.m4.c1{--nc:#ff2bd8}.m4.c2{--nc:#a6ff1a}.m4.c3{--nc:#ff8a14}.m4.c4{--nc:#9b6bff}
.shelf .cell.m4::before{inset:-34%}
.shelf .cell.f.m4,.sheet .cell.f.m4{box-shadow:0 0 calc(var(--cs)*.32) var(--nc),0 0 calc(var(--cs)*.6) calc(var(--cs)*.04) color-mix(in srgb,var(--nc) 45%,transparent)}
.sheet .cell.m4::before{inset:-30%}
.cell.f.m4,.shelf .cell.f.m4{box-shadow:0 0 calc(var(--cs)*.5) var(--nc),0 0 calc(var(--cs)*1.1) calc(var(--cs)*.1) color-mix(in srgb,var(--nc) 50%,transparent)}
.cell.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.cell.rip{animation:rip .7s ease-out var(--rd,0ms)}
.cell.tap{animation:tap .26s ease-out}
.cell.glint{animation:glint .54s ease-out}
.cell.poke{animation:wob .84s cubic-bezier(.2,.7,.3,1)}
.cell.land{animation:land .33s ease-out}
.cell.hm{outline:2px solid var(--gold);outline-offset:-2px;background-color:rgba(255,200,60,.18);z-index:4}
.board.hammering .cell.f{cursor:crosshair}
.cell.sug{opacity:.85;animation:sugp .9s ease-in-out infinite}
.cell.tut-target{outline:2px dashed var(--gold);outline-offset:-2px;animation:tapx 1.1s ease-in-out infinite}

.fx{position:absolute;pointer-events:none;z-index:5;background-size:100% 100%;background-repeat:no-repeat;border-radius:calc(var(--cell)*var(--r,.2))}
.fx.m0{animation:splat .5s ease-out both}
.fx.m1{animation:sandfade .45s ease-in both}
.fx.m2{animation:gemflash .55s ease-out both}
.fx.m4{animation:neonout .8s ease-out both}
.fx.fall{animation:none;z-index:6;box-shadow:0 2px 4px rgba(0,0,0,.5)}

/* tray */
.tray{position:relative;flex:none;width:var(--bw);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;height:calc(var(--cell)*2.35)}
.slot{position:relative;display:grid;place-items:center;border-radius:18px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line);touch-action:none;cursor:grab;transition:background .2s}
.slot.stuck .piece{opacity:.4;filter:grayscale(.6)}
.slot.lifted .piece{opacity:.16}
.slot.sug{background:rgba(255,200,60,.14);box-shadow:inset 0 0 0 2px var(--gold)}
.slot.enter .piece{animation:slotin .42s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(var(--i,0)*80ms)}
.slot.rare{box-shadow:inset 0 0 0 2px var(--nc,#18f0ff),0 0 18px color-mix(in srgb,var(--nc,#18f0ff) 60%,transparent)}
.piece{display:grid;gap:2px;--cs:var(--tcell);pointer-events:none}
.blk{position:relative;width:var(--cs);height:var(--cs);border-radius:calc(var(--cs)*var(--r,.2));background-size:100% 100%;background-repeat:no-repeat;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.piece .blk.m4{z-index:2;box-shadow:0 0 calc(var(--cs)*.6) var(--nc)}
.drag{position:fixed;left:0;top:0;z-index:50;pointer-events:none;will-change:transform;transform-origin:0 0}
.drag .piece{--cs:var(--cell);gap:3px;filter:drop-shadow(0 10px 8px rgba(0,0,0,.5))}

/* feedback over the board */
.glow{position:absolute;inset:-6px;border-radius:26px;pointer-events:none;opacity:0;z-index:6;box-shadow:inset 0 0 0 2px rgba(255,220,120,.9),0 0 36px rgba(255,190,60,.75)}
.glow.on{animation:glow .6s ease-out}
.glow.neon{box-shadow:inset 0 0 0 2px var(--nc,#18f0ff),0 0 44px var(--nc,#18f0ff)}
.banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0;z-index:8}
.banner.show{animation:banner 1.15s cubic-bezier(.2,.9,.3,1) both}
.bw{font:900 34px/1 var(--disp);letter-spacing:-.02em;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 26px rgba(255,200,80,.7)}
.bs{margin-top:6px;font:800 18px var(--disp);color:var(--gold);text-shadow:0 2px 6px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.banner.neon .bw{font-size:40px;color:#fff;text-shadow:0 0 8px var(--nc),0 0 22px var(--nc),0 0 46px var(--nc)}
.banner.neon .bs{color:var(--nc);text-shadow:0 0 12px var(--nc)}
.banner.ms .bw{font-size:42px;background:linear-gradient(180deg,#fff,#ffd75e);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 10px rgba(255,170,30,.6))}
.pt{position:absolute;z-index:7;pointer-events:none;transform:translate(-50%,-50%);font:900 20px var(--disp);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 12px rgba(255,200,80,.8);animation:ptf 1.3s ease-out both;font-variant-numeric:tabular-nums}
.pt.neon{font-size:30px;color:#fff;text-shadow:0 0 6px var(--nc),0 0 18px var(--nc),0 0 38px var(--nc)}
.nflash{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle at 50% 45%,var(--nc,#18f0ff) 0%,transparent 70%)}
.nflash.on{animation:nflash 1.1s ease-out}
.over{position:absolute;inset:-12px -8px;z-index:20;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center;background:rgba(8,10,15,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fade .4s ease both}
.ot{font:700 14px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.os{font:900 54px/1 var(--disp);letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:#fff}
.ob{padding:5px 14px;border-radius:14px;font:800 13px var(--font);letter-spacing:.06em;text-transform:uppercase;background:linear-gradient(180deg,#ffd75e,var(--gold2));color:var(--gold-ink)}
.obest{font:600 14px var(--font);color:var(--muted)}
.ogoal{width:100%;max-width:300px;margin-top:2px}
.ogoal .gbar{height:8px}
.ogoal p{margin:8px 0 0;font:600 14px/1.35 var(--font);color:#d6dbe8}
.ogoal p b{color:var(--gold);font-variant-numeric:tabular-nums}
.over .row{max-width:300px;margin-top:6px}

/* toasts */
#toasts{position:fixed;left:0;right:0;top:calc(var(--sat) + 10px);z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 14px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;max-width:min(94vw,440px);padding:9px 14px 9px 11px;border-radius:16px;background:rgba(32,38,54,.97);box-shadow:inset 0 0 0 1px var(--line2),0 10px 28px -8px rgba(0,0,0,.8);font:600 14px/1.25 var(--font);animation:toastin .3s cubic-bezier(.2,1.2,.4,1) both}
.toast.out{animation:toastout .28s ease-in both}
.toast .ti{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);color:#cdd5e6}
.toast.good .ti{background:rgba(255,200,60,.2);color:var(--gold)}
.toast small{display:block;margin-top:1px;font:500 12px var(--font);color:var(--muted)}

/* sheets */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,4,8,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .25s ease both}
#modal2{z-index:85;align-items:center;padding:20px}
.sheet{position:relative;width:100%;max-width:520px;max-height:min(88vh,760px);display:flex;flex-direction:column;gap:12px;padding:10px 18px calc(18px + var(--sab));border-radius:26px 26px 0 0;background:linear-gradient(180deg,#1b2130,#141924);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 -20px 50px rgba(0,0,0,.5);animation:sheet .35s cubic-bezier(.2,.9,.3,1) both}
.sheet::before{content:"";align-self:center;width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);flex:none}
.sheet.center{max-width:360px;border-radius:26px;align-items:stretch;text-align:center;animation:pop .35s cubic-bezier(.3,1.4,.5,1) both}
.sheet.center::before{display:none}
#modal.mid{align-items:center;padding:20px}
.sheet h2{margin:2px 0 0;font:800 24px var(--disp);letter-spacing:-.02em}
.sheet .eyebrow{font:700 12px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sheet .sub{margin:-4px 0 0;color:var(--muted);font:500 14px/1.4 var(--font)}
.sheet .scroll{display:flex;flex-direction:column;gap:6px;min-height:0;flex:1}
.sheet .x{position:absolute;right:14px;top:14px;width:36px;height:36px}
.sec{padding:10px 0;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.lt{font:600 16px var(--font)}
.note{margin:6px 0;color:var(--muted);font:500 13px/1.4 var(--font)}

/* leaderboard */
.lb-me{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(255,200,60,.1);box-shadow:inset 0 0 0 1px rgba(255,200,60,.3)}
.lb-me .who{flex:1;min-width:0;text-align:left}
.lb-me b{display:block;font:800 16px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-me span{display:block;margin-top:2px;font:500 12px var(--font);color:var(--muted)}
.lb-me .sc{font:900 20px var(--disp);color:var(--gold);font-variant-numeric:tabular-nums}
.lb-list{display:flex;flex-direction:column;gap:2px;min-height:90px}
.lb-row{display:flex;align-items:center;gap:12px;padding:9px 6px;border-radius:12px}
.lb-row.me{background:rgba(255,200,60,.12)}
.lb-pos{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--font);color:var(--muted);background:rgba(255,255,255,.06);font-variant-numeric:tabular-nums}
.lb-row:nth-child(1) .lb-pos{background:linear-gradient(180deg,#ffe07a,#ff9a1f);color:var(--gold-ink)}
.lb-row:nth-child(2) .lb-pos{background:linear-gradient(180deg,#f2f5fa,#a7b0c2);color:#1b2130}
.lb-row:nth-child(3) .lb-pos{background:linear-gradient(180deg,#f0b27a,#b4682f);color:#2a1300}
.lb-name{flex:1;min-width:0;text-align:left}
.lb-name b{display:block;font:700 15px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-name small{display:block;font:500 12px var(--font);color:var(--muted)}
.lb-sc{font:800 16px var(--disp);font-variant-numeric:tabular-nums}
.lb-row.legend .lb-name b::after{content:" ♛";color:var(--gold)}
.lb-empty{padding:26px 8px;text-align:center;color:var(--muted);font:500 14px/1.45 var(--font)}
.lb-name-row{display:flex;gap:8px}
.lb-name-row .field{flex:1}
.lb-name-row .cta{min-height:46px;padding:0 16px;font-size:15px;border-radius:12px}
.spin{width:22px;height:22px;margin:22px auto;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--gold);animation:spin .8s linear infinite}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:12px;border-radius:14px;background:rgba(255,255,255,.05);text-align:left}
.stat b{display:block;font:800 20px var(--disp);font-variant-numeric:tabular-nums}
.stat span{font:500 12px var(--font);color:var(--muted)}

/* tutorial hand */
.hand{position:fixed;left:0;top:0;z-index:70;width:48px;height:48px;pointer-events:none;animation:handmove 2.1s ease-in-out infinite}
.hand svg{width:100%;height:100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}

/* ---------- animation ---------- */
@keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes jig{0%,100%{transform:scale(1,1)}25%{transform:scale(1.025,.975)}50%{transform:scale(.98,1.02)}75%{transform:scale(1.015,.985)}}
@keyframes sheen{0%,62%{background-position:160% 0}84%,100%{background-position:-70% 0}}
@keyframes npulse{0%,100%{filter:brightness(1) saturate(1.1)}50%{filter:brightness(1.35) saturate(1.3)}}
@keyframes nhalo{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:.8;transform:scale(1.15)}}
@keyframes rip{0%,100%{transform:scale(1)}35%{transform:scale(var(--amp,.95))}}
@keyframes tap{0%{transform:scale(1)}40%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes glint{0%{filter:brightness(1)}30%{filter:brightness(1.7) saturate(1.3)}100%{filter:brightness(1)}}
@keyframes wob{0%{transform:scale(1)}15%{transform:scale(1.14,.82)}30%{transform:scale(.88,1.14)}48%{transform:scale(1.07,.94)}66%{transform:scale(.97,1.04)}100%{transform:scale(1)}}
@keyframes land{0%{transform:translateY(-3px) scale(1.06,.9)}55%{transform:scale(.97,1.04)}100%{transform:none}}
@keyframes splat{0%{transform:scale(1);opacity:1}40%{transform:scale(1.25,.8);opacity:.9}100%{transform:scale(1.5,.2) translateY(30%);opacity:0}}
@keyframes sandfade{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.8) translateY(20%)}}
@keyframes gemflash{0%{filter:brightness(1);opacity:1;transform:scale(1)}30%{filter:brightness(2.4);opacity:1;transform:scale(1.12)}100%{filter:brightness(3);opacity:0;transform:scale(1.4)}}
@keyframes neonout{0%{filter:brightness(1.4);opacity:1;transform:scale(1)}30%{filter:brightness(3);transform:scale(1.4);opacity:1}100%{filter:brightness(4);opacity:0;transform:scale(2.4)}}
@keyframes glow{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes banner{0%{opacity:0;transform:translateY(14px) scale(.7)}25%{opacity:1;transform:scale(1.08)}45%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
@keyframes ptf{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
@keyframes nflash{0%{opacity:0}12%{opacity:.75}100%{opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-3px,1px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,2px)}80%{transform:translate(2px,-1px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
@keyframes bin{0%{opacity:0}8%,40%{opacity:1}50%,100%{opacity:0}}
@keyframes bout{0%,50%{opacity:0}58%,90%{opacity:1}100%{opacity:0}}
@keyframes slotin{from{opacity:0;transform:translateY(16px) scale(.6)}to{opacity:1;transform:none}}
@keyframes sugp{0%,100%{opacity:.5}50%{opacity:.9}}
@keyframes tapx{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes bpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes toastin{from{opacity:0;transform:translateY(-14px) scale(.94)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(-10px) scale(.96)}}
@keyframes cpulse{0%{transform:scale(1)}40%{transform:scale(1.32)}100%{transform:scale(1)}}
@keyframes cwob{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg) translateY(-1px)}}
@keyframes molten{to{background-position:-240% 0}}
@keyframes gone{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-30%) scale(.7)}}
@keyframes shine{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes handmove{0%{transform:translate(var(--x0),var(--y0)) scale(1);opacity:0}12%{opacity:1}22%{transform:translate(var(--x0),var(--y0)) scale(.9)}70%{transform:translate(var(--x1),var(--y1)) scale(.9);opacity:1}90%,100%{transform:translate(var(--x1),var(--y1)) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .cell.f.m0,.cell.f.m2::after,.bigplay::after,.zen .board{animation:none}
}
.lowfx .cell.f.m0,.lowfx .cell.f.m2::after,.lowfx .bigplay::after,.lowfx .zen .board{animation:none}
@media (max-height:600px){
  .homebody{gap:10px}.brand h1{font-size:40px}.bigplay{min-height:84px}.bp-t{font-size:27px}.gc-ms{display:none}
}
@media (max-height:520px){
  .goal-t,.over .ogoal p,.hint{display:none}
  .status{height:30px}
  .top{min-height:38px}.num{font-size:28px}.score small{display:none}
}

/* ---------- home: music button, infinity ---------- */
.hbtns{display:flex;align-items:center;gap:10px}
.icbtn.sm{width:36px;height:36px}
.icbtn.off{color:#7d879b}
.bp-t .inf{width:96px;height:42px;fill:none;stroke:var(--gold-ink);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;overflow:visible;filter:drop-shadow(0 1px 0 rgba(255,255,255,.35))}
.bp-t{line-height:0}
.langs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.langs button{flex:1 1 calc(33% - 6px);min-height:38px;border:0;border-radius:10px;padding:0 8px;background:rgba(255,255,255,.07);color:var(--muted);font:600 14px var(--font);cursor:pointer}
.langs button[aria-pressed=true]{background:#313a4f;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,200,61,.5)}
.hcombo{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:9px;background:#2a1606;color:#ffb347;font:900 12px var(--disp);text-shadow:0 0 8px #ff7a12}
.hbg{width:36px;height:36px;flex:none;border-radius:9px;overflow:hidden;position:relative}
.hbg .bgl{position:absolute;inset:0}

/* ---------- backgrounds (one per record tier) ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#07080c}
.bgl{position:absolute;inset:0;overflow:hidden}
.bgl.fade{animation:bgin 1.6s ease both}
.bgl>i,.bgl>b{position:absolute;inset:0;pointer-events:none}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%);pointer-events:none}
@keyframes bgin{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
.stars{background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 72% 12%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 38% 42%,#cfe 50%,transparent 51%),radial-gradient(1px 1px at 88% 56%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 22% 76%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 60% 86%,#dff 50%,transparent 51%);background-size:180px 220px}
/* 0 night */
.b0{background:radial-gradient(120% 55% at 50% -8%,#1b2540 0%,transparent 62%),radial-gradient(90% 40% at 50% 112%,#1a1226 0%,transparent 70%),#080a0f}
/* 1 deep: sunbeams in dark water, rising bubbles */
.b1{background:radial-gradient(90% 50% at 50% -10%,#1d6f8f 0%,transparent 70%),linear-gradient(180deg,#06324a 0%,#041d30 45%,#020b14 100%)}
.b1>i{background:repeating-linear-gradient(98deg,rgba(140,230,255,.09) 0 26px,transparent 26px 80px,rgba(140,230,255,.05) 80px 96px,transparent 96px 170px);-webkit-mask-image:linear-gradient(180deg,#000,transparent 75%);mask-image:linear-gradient(180deg,#000,transparent 75%);transform-origin:50% 0;animation:rays 9s ease-in-out infinite alternate}
.b1>b{background-image:radial-gradient(circle at 30% 40%,rgba(200,245,255,.45) 0 1.6px,transparent 2.6px),radial-gradient(circle at 70% 70%,rgba(200,245,255,.3) 0 1.1px,transparent 2px);background-size:170px 230px,110px 170px;background-position:20px 0,70px 40px;animation:bubbles 14s linear infinite;opacity:.45}
/* 2 forest: green dusk, mist, fireflies */
.b2{background:radial-gradient(80% 45% at 50% 0%,#2b5a2c 0%,transparent 70%),radial-gradient(70% 35% at 20% 100%,#14321a 0%,transparent 70%),linear-gradient(180deg,#0f2a1a,#06170e 60%,#020904)}
.b2>i{background:radial-gradient(60% 18% at 30% 62%,rgba(170,220,170,.12),transparent 70%),radial-gradient(70% 16% at 75% 78%,rgba(170,220,170,.1),transparent 70%);animation:mist 16s ease-in-out infinite alternate}
.b2>b{background-image:radial-gradient(circle,#f6ff9a 0 1.6px,rgba(220,255,110,.35) 2.5px,transparent 6px),radial-gradient(circle,#eaff8a 0 1.2px,rgba(220,255,110,.3) 2px,transparent 5px);background-size:170px 210px,120px 160px;background-position:30px 60px,90px 10px;animation:flies 7s ease-in-out infinite alternate}
/* 3 sunset */
.b3{background:radial-gradient(50% 22% at 50% 74%,rgba(255,220,140,.75) 0%,rgba(255,140,60,.35) 40%,transparent 75%),linear-gradient(180deg,#1b0f33 0%,#4a1a4e 30%,#a33a4f 55%,#e3743d 72%,#5a2232 86%,#1a0c16 100%)}
.b3>i{background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.05) 50%,rgba(0,0,0,.45))}
.b3>b{background:radial-gradient(120% 12% at 30% 40%,rgba(255,170,120,.18),transparent 70%),radial-gradient(90% 8% at 70% 50%,rgba(255,150,110,.16),transparent 70%);animation:mist 20s ease-in-out infinite alternate}
/* 4 aurora */
.b4{background:linear-gradient(180deg,#03101a 0%,#041722 50%,#02070d 100%)}
.b4>i{background:radial-gradient(60% 22% at 30% 28%,rgba(60,255,170,.45),transparent 70%),radial-gradient(55% 18% at 62% 22%,rgba(80,200,255,.35),transparent 70%),radial-gradient(50% 20% at 75% 36%,rgba(170,90,255,.35),transparent 70%);filter:blur(14px);animation:aurora 10s ease-in-out infinite alternate}
.b4>b{background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 72% 12%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 38% 42%,#cfe 50%,transparent 51%),radial-gradient(1px 1px at 88% 56%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 22% 76%,#fff 50%,transparent 51%);background-size:180px 220px;animation:twinkle 4s ease-in-out infinite alternate}
/* 5 gold */
.b5{background:radial-gradient(80% 50% at 50% 0%,#5a420c 0%,transparent 70%),radial-gradient(70% 40% at 50% 110%,#3a2604 0%,transparent 70%),linear-gradient(180deg,#1d1404,#0e0902 70%,#060401)}
.b5>i{background:linear-gradient(115deg,transparent 30%,rgba(255,215,120,.16) 45%,rgba(255,240,190,.28) 50%,rgba(255,215,120,.16) 55%,transparent 70%);background-size:300% 100%;animation:sheen2 6s ease-in-out infinite}

<script>
(function(){
'use strict';
// ===== logic.js =====
// Game engine: pure functions, no DOM. Used by the page and by the Node tests.
const Logic = (function(){
'use strict';

const N=7, CELLS=49;
// materials: slime, sand, gem, (3 unused), neon
const MAT={SLIME:0,SAND:1,GEM:2,NEON:4};
const NCOLORS=[4,7,6,0,5];           // colours per material
const NEON_P=1e-4;                   // chance that one block is neon
const NEON_MULT=10;                  // points multiplier of a clear that contains a neon block

// A cell holds 0 (empty) or mat*16 + colour + 1.
function enc(mat,color){ return mat*16+color+1; }
function matOf(v){ return (v>>4)&7; }
function colOf(v){ return (v&15)-1; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }

function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
// The same generator with its state exposed, so a run can be saved in the middle and continued exactly.
function makeRng(seed){
  let a=seed|0;
  const f=function(){
    a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
  f.get=function(){ return a|0; };
  f.set=function(s){ a=s|0; };
  return f;
}
// The seed of a leaderboard run is tied to the player and to the moment the run began (FNV-1a),
// so a recorded run cannot be copied under somebody else's name.
function seedFor(uid,ts){
  const str=String(uid)+'|'+String(ts);
  let h=0x811c9dc5;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193); }
  h^=h>>>15; h=Math.imul(h,0x2c1b3c6d); h^=h>>>12;
  return h>>>0;
}

const NB=[];
for(let i=0;i<CELLS;i++){
  const r=(i/N)|0, c=i%N, o=[];
  if(r>0) o.push(i-N); if(r<N-1) o.push(i+N); if(c>0) o.push(i-1); if(c<N-1) o.push(i+1);
  NB.push(o);
}

// weight, rows, hardness (0 friendly .. 1 awkward). New shapes are only ever appended: ids are stored in saved games.
const DEFS=[

  [1.8,['###','.#.'],.5],[1.8,['.#.','###'],.5],[1.8,['#.','##','#.'],.5],[1.8,['.#','##','.#'],.5],
  [1.5,['.##','##.'],.7],[1.5,['##.','.##'],.7],[1.5,['#.','##','.#'],.7],[1.5,['.#','##','#.'],.7],
  // ---- added in the second edition ----
  [1.0,['#.','.#'],.45],[1.0,['.#','#.'],.45],                                   // short diagonals
  [0.8,['#..','.#.','..#'],.7],[0.8,['..#','.#.','#..'],.7],                     // long diagonals
  [0.9,['.#.','###','.#.'],.8],                                                   // plus
  [0.9,['#.#','###'],.65],[0.9,['###','#.#'],.65],[0.9,['##','#.','##'],.65],[0.9,['##','.#','##'],.65], // U
  [0.7,['###','.#.','.#.'],.8],[0.7,['.#.','.#.','###'],.8],[0.7,['#..','###','#..'],.8],[0.7,['..#','###','..#'],.8], // long T

  [0.6,['#..','##.','.##'],.9],[0.6,['..#','.##','##.'],.9],                     // stairs
  [0.8,['##','##','#.'],.6],[0.8,['##','##','.#'],.6],[0.8,['#.','##','##'],.6],[0.8,['.#','##','##'],.6],   // P
  [0.8,['###','##.'],.6],[0.8,['###','.##'],.6],[0.8,['##.','###'],.6],[0.8,['.##','###'],.6],
  [0.6,['####','#...'],.8],[0.6,['####','...#'],.8],[0.6,['#...','####'],.8],[0.6,['...#','####'],.8],        // long L
  [0.6,['##','#.','#.','#.'],.8],[0.6,['##','.#','.#','.#'],.8],[0.6,['#.','#.','#.','##'],.8],[0.6,['.#','.#','.#','##'],.8],
  [0.7,['####','####'],.7],[0.7,['##','##','##','##'],.7],                         // 2 x 4
  [0.3,['###','#.#','###'],1]                                                      // ring
];
const SHAPES=DEFS.map(function(d,id){
  const rows=d[1], cells=[];
  rows.forEach(function(row,r){ for(let c=0;c<row.length;c++){ if(row[c]==='#') cells.push([r,c]); } });
  return {id:id, weight:d[0], hard:d[2], cells:cells, h:rows.length, w:rows[0].length, n:cells.length};
});
const BASE_SHAPES=37;

// ---------- difficulty ----------
function diffT(d){ return (clamp(d,1,10)-1)/9; }
function assistChance(d){ return 0.8-0.78*diffT(d); }
// How hard the classic game is at a given score: starts hard and keeps climbing, flattening near 10.
function rankDiff(score){ return clamp(5+5*(1-Math.exp(-Math.max(0,score)/8000)),5,10); }
function startBlocks(d){ return Math.round(Math.pow(diffT(d),1.3)*11); }

// ---------- placement and lines ----------
function canPlaceAt(grid,shape,r0,c0){
  const cs=shape.cells;
  for(let k=0;k<cs.length;k++){
    const rr=r0+cs[k][0], cc=c0+cs[k][1];
    if(rr<0||cc<0||rr>=N||cc>=N||grid[rr*N+cc]) return false;
  }
  return true;
}
function canPlaceAnywhere(grid,shape){
  for(let r0=0;r0<=N-shape.h;r0++) for(let c0=0;c0<=N-shape.w;c0++) if(canPlaceAt(grid,shape,r0,c0)) return true;
  return false;
}
function countPlacements(grid,shape){
  let n=0;
  for(let r0=0;r0<=N-shape.h;r0++) for(let c0=0;c0<=N-shape.w;c0++) if(canPlaceAt(grid,shape,r0,c0)) n++;
  return n;
}
// piece: {shape,color,mat, neon:index of the neon cell or -1/undefined, nc: neon colour}
function placePiece(grid,piece,r0,c0){
  const placed=[], v=enc(piece.mat,piece.color);
  const hasNeon=piece.neon!==undefined&&piece.neon>=0;
  piece.shape.cells.forEach(function(p,k){
    const i=(r0+p[0])*N+c0+p[1];
    grid[i]=(hasNeon&&k===piece.neon)?enc(4,piece.nc|0):v;
    placed.push(i);
  });
  return placed;
}
function fullLines(grid){
  const rows=[], cols=[];
  for(let r=0;r<N;r++){
    let ok=true;
    for(let c=0;c<N;c++){ if(!grid[r*N+c]){ ok=false; break; } }
    if(ok) rows.push(r);
  }
  for(let c=0;c<N;c++){
    let ok=true;
    for(let r=0;r<N;r++){ if(!grid[r*N+c]){ ok=false; break; } }
    if(ok) cols.push(c);
  }
  return {rows:rows, cols:cols};
}

// Everything that disappears because of the full lines on the board right now:
// the lines themselves, whole slime drops touched by a line, and every gem that
// shares a colour with a gem in a line (resonance).
function findClear(grid){
  const fl=fullLines(grid);
  if(!fl.rows.length&&!fl.cols.length) return null;
  const base=new Set();
  fl.rows.forEach(function(r){ for(let c=0;c<N;c++) base.add(r*N+c); });
  fl.cols.forEach(function(c){ for(let r=0;r<N;r++) base.add(r*N+c); });
  const extra=new Set(), seen=new Set();
  let blobMax=0;
  base.forEach(function(i){
    const v=grid[i];
    if(matOf(v)!==0||seen.has(i)) return;
    const col=colOf(v), comp=[i]; seen.add(i);
    for(let k=0;k<comp.length;k++){
      const nb=NB[comp[k]];
      for(let q=0;q<nb.length;q++){
        const j=nb[q]; if(seen.has(j)) continue;
        const w=grid[j];
        if(w&&matOf(w)===0&&colOf(w)===col){ seen.add(j); comp.push(j); }
      }
    }
    if(comp.length>blobMax) blobMax=comp.length;
    comp.forEach(function(j){ if(!base.has(j)) extra.add(j); });
  });
  const rc=new Set();
  base.forEach(function(i){ const v=grid[i]; if(matOf(v)===2) rc.add(colOf(v)); });
  let resonance=0;
  if(rc.size){
    for(let j=0;j<CELLS;j++){
      const w=grid[j];
      if(w&&matOf(w)===2&&rc.has(colOf(w))&&!base.has(j)){ extra.add(j); resonance++; }
    }
  }
  const all=new Set(base); extra.forEach(function(j){ all.add(j); });
  return {lines:fl.rows.length+fl.cols.length, rows:fl.rows, cols:fl.cols, base:base, extra:extra, all:all, blobMax:blobMax, resonance:resonance, resColors:[...rc]};
}

function executeClear(grid,fc,lite){
  const cleared=[];
  fc.all.forEach(function(i){ cleared.push([i,colOf(grid[i]),matOf(grid[i])]); });
  fc.all.forEach(function(i){ grid[i]=0; });
  const colSet=new Set();
  cleared.forEach(function(c){ colSet.add(c[0]%N); });
  let neon=0; cleared.forEach(function(c){ if(c[2]===4) neon++; });
  const step={kind:'clear', lines:fc.lines, rows:fc.rows, cols:fc.cols, cleared:cleared, extra:fc.extra.size,
    blobMax:fc.blobMax, resonance:fc.resonance, resColors:fc.resColors, neon:neon, colSet:[...colSet]};
  if(!lite) step.after=grid.slice();
  return step;
}
// Sand slides down into the gaps in the given columns.
function applyGravity(grid,cols){
  const falls=[];
  cols.forEach(function(c){
    for(let r=N-2;r>=0;r--){
      const i=r*N+c, v=grid[i];
      if(!v||matOf(v)!==1) continue;
      let t=r;
      while(t+1<N&&grid[(t+1)*N+c]===0) t++;
      if(t!==r){ const j=t*N+c; grid[j]=v; grid[i]=0; falls.push({from:i,to:j,v:v}); }
    }
  });
  return falls;
}
// Clears whatever is full right now. Blocks never fall (as in Block Blast), so one pass is enough.
function runChain(grid,startCols,lite){
  const fc=findClear(grid);
  return fc?[executeClear(grid,fc,lite)]:[];
}
function simulate(grid,piece,r0,c0){
  const g=grid.slice();
  placePiece(g,piece,r0,c0);
  const steps=runChain(g,null,true);
  let lines=0, cleared=0;
  steps.forEach(function(s){ if(s.kind==='clear'){ lines+=s.lines; cleared+=s.cleared.length; } });
  return {grid:g,lines:lines,cleared:cleared,steps:steps};
}

// ---------- hammer and exhale ----------
function hammerCells(grid,i){
  const r=(i/N)|0, c=i%N, out=[];
  for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
    const rr=r+dr, cc=c+dc;
    if(rr<0||cc<0||rr>=N||cc>=N) continue;
    const j=rr*N+cc; if(grid[j]) out.push(j);
  }
  return out;
}
function applyHammer(grid,i){
  const cells=hammerCells(grid,i);
  if(!cells.length) return null;
  const cleared=cells.map(function(j){ return [j,colOf(grid[j]),matOf(grid[j])]; });
  cells.forEach(function(j){ grid[j]=0; });
  const colSet=[...new Set(cells.map(function(j){ return j%N; }))];
  const step={kind:'hammer', cleared:cleared, lines:0, extra:0, blobMax:0, resonance:0, resColors:[], neon:0, colSet:colSet, centre:i};
  step.after=grid.slice();
  return {hammer:step, steps:runChain(grid,colSet,false)};
}
// Zen mode: when the board is full, the fullest rows are released until something fits.
function exhale(grid,tray){
  const rows=[];
  for(let r=0;r<N;r++){
    let n=0; for(let c=0;c<N;c++){ if(grid[r*N+c]) n++; }
    rows.push({r:r,n:n});
  }
  rows.sort(function(a,b){ return b.n-a.n||a.r-b.r; });
  const cleared=[];
  for(let k=0;k<rows.length;k++){
    const r=rows[k].r;
    for(let c=0;c<N;c++){
      const i=r*N+c, v=grid[i];
      if(v){ cleared.push([i,colOf(v),matOf(v)]); grid[i]=0; }
    }
    if(k>=1&&anyMove(grid,tray)) break;
  }
  const colSet=[...new Set(cleared.map(function(c){ return c[0]%N; }))];
  const step={kind:'exhale',cleared:cleared,lines:0,extra:0,blobMax:0,resonance:0,resColors:[],neon:0,colSet:colSet,after:grid.slice()};
  return {exhale:step, steps:runChain(grid,colSet,false)};
}

// ---------- pieces ----------
function fillRatio(grid){ let n=0; for(let i=0;i<CELLS;i++) if(grid[i]) n++; return n/CELLS; }
const TUNE={hardK:6,hardMid:0.2,mercy:0.95,comboBase:2.4};
function pickShape(grid,rng,diff){
  const t=diffT(diff===undefined?3:diff), fr=fillRatio(grid), mercy=1-TUNE.mercy*t;
  let total=0;
  const ws=SHAPES.map(function(s){
    const hardF=Math.exp((t-TUNE.hardMid)*TUNE.hardK*(s.hard-0.4));
    const fillF=s.n>=5?1-0.85*fr:s.n===4?1-0.35*fr:1+0.8*fr;
    const w=s.weight*hardF*Math.max(0.12,1+(fillF-1)*mercy);
    total+=w; return w;
  });
  let x=rng()*total;
  for(let i=0;i<SHAPES.length;i++){ x-=ws[i]; if(x<=0) return SHAPES[i]; }
  return SHAPES[SHAPES.length-1];
}
function pickMat(rng,mats){
  const base=[0.36,0.36,0.28];
  let total=0; const ws=mats.map(function(m){ const w=base[m]; total+=w; return w; });
  let x=rng()*total;
  for(let i=0;i<mats.length;i++){ x-=ws[i]; if(x<=0) return mats[i]; }
  return mats[mats.length-1];
}
function pickColor(rng,mat,grid,diff){
  const n=NCOLORS[mat];
  if(mat!==1&&grid&&rng()<0.6-0.35*diffT(diff===undefined?3:diff)){
    const present=[];
    for(let i=0;i<CELLS;i++){ const v=grid[i]; if(v&&matOf(v)===mat){ const c=colOf(v); if(present.indexOf(c)<0) present.push(c); } }
    if(present.length) return present[Math.floor(rng()*present.length)];
  }
  return Math.floor(rng()*n);
}
function canClearSomewhere(grid,piece){
  const sh=piece.shape;
  for(let r0=0;r0<=N-sh.h;r0++) for(let c0=0;c0<=N-sh.w;c0++){
    if(!canPlaceAt(grid,sh,r0,c0)) continue;
    const g=grid.slice(); placePiece(g,piece,r0,c0);
    const fl=fullLines(g);
    if(fl.rows.length||fl.cols.length) return true;
  }
  return false;
}
// Can all pieces be placed one after another (in some order)? true / false / null (gave up).
function solveSet(grid,pieces,budget){
  let calls=0, exhausted=false;
  const seen=new Set();
  const dfs=function(g,rem){
    if(!rem.length) return true;
    const key=g.join(',')+'|'+rem.map(function(p){ return p.shape.id; }).sort().join('.');
    if(seen.has(key)) return false;
    const tried=new Set();
    for(let k=0;k<rem.length;k++){
      const p=rem[k], sh=p.shape;
      if(tried.has(sh.id)) continue;
      tried.add(sh.id);
      for(let r0=0;r0<=N-sh.h;r0++) for(let c0=0;c0<=N-sh.w;c0++){
        if(!canPlaceAt(g,sh,r0,c0)) continue;
        if(++calls>budget){ exhausted=true; return false; }
        const g2=g.slice(); placePiece(g2,p,r0,c0); runChain(g2,null,true);
        if(dfs(g2,rem.filter(function(_,x){ return x!==k; }))) return true;
        if(exhausted) return false;
      }
    }
    seen.add(key);
    return false;
  };
  const ok=dfs(grid.slice(),pieces.slice());
  return ok?true:(exhausted?null:false);
}
function mobility(grid,set){
  let m=0;
  set.forEach(function(p){ m+=countPlacements(grid,p.shape); });
  return m;
}
function addNeon(rng,piece,p){
  const k=piece.shape.n;
  if(rng()<k*p){ piece.neon=Math.floor(rng()*k); piece.nc=Math.floor(rng()*NCOLORS[4]); }
  return piece;
}
function mkPiece(grid,rng,diff,mats,neonP){
  const mat=pickMat(rng,mats);
  const p={shape:pickShape(grid,rng,diff), color:pickColor(rng,mat,grid,diff), mat:mat, neon:-1, nc:0};
  return addNeon(rng,p,neonP);
}

// ---------- combo pressure ----------
// Number of single placements (over all pieces of the set) that complete a line right now.
function countClears(grid,set){
  const rc=new Array(N).fill(0), cc=new Array(N).fill(0), occ=new Array(CELLS);
  for(let i=0;i<CELLS;i++){ occ[i]=grid[i]?1:0; if(occ[i]){ rc[(i/N)|0]++; cc[i%N]++; } }
  let n=0;
  set.forEach(function(p){
    const sh=p.shape;
    for(let r0=0;r0<=N-sh.h;r0++) for(let c0=0;c0<=N-sh.w;c0++){
      let ok=true;
      for(let k=0;k<sh.cells.length;k++){ if(occ[(r0+sh.cells[k][0])*N+c0+sh.cells[k][1]]){ ok=false; break; } }
      if(!ok) continue;
      const add=new Array(N).fill(0), addc=new Array(N).fill(0);
      sh.cells.forEach(function(q){ add[r0+q[0]]++; addc[c0+q[1]]++; });
      let done=false;
      for(let q=0;q<N&&!done;q++){ if(add[q]&&rc[q]+add[q]===N) done=true; if(addc[q]&&cc[q]+addc[q]===N) done=true; }
      if(done) n++;
    }
  });
  return n;
}
// Can some order and placement of at most `n` pieces of the set complete a line? (budget: placements tried)
function clearWithin(grid,set,n,budget){
  const rc=new Array(N).fill(0), cc=new Array(N).fill(0), occ=new Array(CELLS);
  for(let i=0;i<CELLS;i++){ occ[i]=grid[i]?1:0; if(occ[i]){ rc[(i/N)|0]++; cc[i%N]++; } }
  let calls=0;
  const rec=function(rem,left){
    for(let k=0;k<rem.length;k++){
      const sh=rem[k].shape;
      for(let r0=0;r0<=N-sh.h;r0++) for(let c0=0;c0<=N-sh.w;c0++){
        let ok=true;
        for(let q=0;q<sh.cells.length;q++){ if(occ[(r0+sh.cells[q][0])*N+c0+sh.cells[q][1]]){ ok=false; break; } }
        if(!ok) continue;
        if(++calls>budget) return false;
        sh.cells.forEach(function(q){ occ[(r0+q[0])*N+c0+q[1]]=1; rc[r0+q[0]]++; cc[c0+q[1]]++; });
        let done=false;
        for(let q=0;q<N&&!done;q++){ if(rc[q]===N||cc[q]===N) done=true; }
        if(!done&&left>1) done=rec(rem.filter(function(_,x){ return x!==k; }),left-1);
        sh.cells.forEach(function(q){ occ[(r0+q[0])*N+c0+q[1]]=0; rc[r0+q[0]]--; cc[c0+q[1]]--; });
        if(done) return true;
      }
    }
    return false;
  };
  return rec(set,n);
}

// Three pieces for the tray. Every set that comes out can be placed in full (in some order),
// so the player is never given a hand that is already lost. Harder levels pick the sets that
// leave the least room to manoeuvre among the playable ones.
function generateTray(grid,rng,diff,opts){
  rng=rng||Math.random; opts=opts||{};
  diff=diff===undefined?3:diff;
  const mats=opts.mats&&opts.mats.length?opts.mats:[0,1,2];
  const neonP=opts.neonP===undefined?NEON_P:opts.neonP;
  const t=diffT(diff);
  const cands=[];
  let spent=0;
  const wantN=opts.cands||10, maxTry=opts.tries||40, budget=opts.budget||2200, total=opts.total||14000;
  for(let a=0;a<maxTry&&cands.length<wantN&&spent<total;a++){
    const set=[mkPiece(grid,rng,diff,mats,neonP),mkPiece(grid,rng,diff,mats,neonP),mkPiece(grid,rng,diff,mats,neonP)];
    if(set[0].shape===set[1].shape&&set[1].shape===set[2].shape) continue;
    spent+=300;
    const r=solveSet(grid,set,budget);
    if(r!==true) continue;
    cands.push({set:set,mob:mobility(grid,set),clr:set.some(function(p){ return canClearSomewhere(grid,p); })});
  }
  if(!cands.length) return safeSet(grid,rng,diff,mats,neonP);
  // Inside a combo the deal gets harder step by step: the number of free line-clearing options is
  // 10% lower than in the step before, down to deals where a line needs a plan across several pieces.
  // Only sets from which the combo can still be kept alive are ever dealt.
  if((opts.combo|0)>0){
    const left=Math.max(1,COMBO_GRACE-(opts.misses|0));
    const info=cands.map(function(c){ return {c:c,opt:countClears(grid,c.set)}; });
    let mean=0; info.forEach(function(x){ mean+=x.opt; }); mean/=info.length;
    const alive=info.filter(function(x){ return x.opt>0||(left>1&&clearWithin(grid,x.c.set,left,2500)); });
    if(alive.length){
      const target=mean*TUNE.comboBase*Math.pow(COMBO_HARDER,(opts.combo|0)-1);
      let best=null, bd=1e9;
      alive.forEach(function(x){ const d=Math.abs(x.opt-target)+rng()*0.01; if(d<bd){ bd=d; best=x; } });
      return best.c.set;
    }
    // none of the hands could keep the combo going: look a little further for one that can
    for(let a=0;a<80;a++){
      const set=[mkPiece(grid,rng,diff,mats,neonP),mkPiece(grid,rng,diff,mats,neonP),mkPiece(grid,rng,diff,mats,neonP)];
      if(set[0].shape===set[1].shape&&set[1].shape===set[2].shape) continue;
      if(solveSet(grid,set,budget)!==true) continue;
      if(countClears(grid,set)>0||(left>1&&clearWithin(grid,set,left,2500))) return set;
    }
  }
  let pool=cands;
  if(rng()<assistChance(diff)){
    const withClear=cands.filter(function(c){ return c.clr; });
    if(withClear.length) pool=withClear;
  }
  pool=pool.slice().sort(function(a,b){ return a.mob-b.mob; });
  // t=1 -> one of the hardest, t=0 -> one of the easiest
  const x=Math.pow(1-t,1.3);
  let idx=Math.round(x*(pool.length-1)+(rng()-0.5)*0.9);
  idx=clamp(idx,0,pool.length-1);
  return pool[idx].set;
}
// Small pieces only: used when the board is so crowded that no ordinary set could be proven playable.
function safeSet(grid,rng,diff,mats,neonP){
  const small=SHAPES.filter(function(s){ return s.n<=3; });
  for(let a=0;a<60;a++){
    const set=[0,1,2].map(function(){
      const mat=pickMat(rng,mats), sh=small[Math.floor(rng()*small.length)];
      return addNeon(rng,{shape:sh,color:pickColor(rng,mat,grid,diff),mat:mat,neon:-1,nc:0},neonP);
    });
    if(solveSet(grid,set,3000)===true) return set;
  }
  const dot=SHAPES[0];
  return [0,1,2].map(function(){
    const mat=pickMat(rng,mats);
    return {shape:dot,color:pickColor(rng,mat,grid,diff),mat:mat,neon:-1,nc:0};
  });
}
function anyMove(grid,tray){
  return tray.some(function(p){ return p&&canPlaceAnywhere(grid,p.shape); });
}

// ---------- boards ----------
function makeStartGrid(d,rng,opts){
  opts=opts||{}; rng=rng||Math.random;
  const mats=opts.mats&&opts.mats.length?opts.mats:[0,1,2];
  const g=new Array(CELLS).fill(0);
  let target=opts.count!==undefined?opts.count:startBlocks(d), guard=0;
  while(target>0&&guard++<400){
    let cur=Math.floor(rng()*CELLS);
    const size=Math.min(target,2+Math.floor(rng()*3));
    const mat=mats[Math.floor(rng()*mats.length)];
    const colour=Math.floor(rng()*NCOLORS[mat]);
    for(let k=0;k<size;k++){
      if(!g[cur]){ g[cur]=enc(mat,mat===1?Math.floor(rng()*NCOLORS[1]):colour); target--; if(target<=0) break; }
      const nb=NB[cur];
      cur=nb[Math.floor(rng()*nb.length)];
    }
  }
  for(let guard2=0;guard2<10;guard2++){
    const fl=fullLines(g);
    if(!fl.rows.length&&!fl.cols.length) break;
    if(fl.rows.length) g[fl.rows[0]*N]=0; else g[fl.cols[0]]=0;
  }
  return g;
}

// ---------- scoring ----------
function lineScore(n){ return 10*n*(n+1)/2; }
// Combo: every move that clears a line adds one; COMBO_GRACE moves in a row without a clear end it.
// The series has no top: each step pays more than the last, up to COMBO_CAP points per move, and the
// 128th step in a row pays COMBO_JACKPOT.
const COMBO_GRACE=3, COMBO_CAP=5000, COMBO_JACKPOT_AT=128, COMBO_JACKPOT=10000;
const COMBO_HARDER=0.9;        // every step leaves 10% fewer free line-clearing options in the next deal
function comboBonus(k){
  if(k<2) return 0;
  if(k===COMBO_JACKPOT_AT) return COMBO_JACKPOT;
  return Math.min(COMBO_CAP,Math.round(Math.pow(k,1.5))*5);
}
// Points for one move (without the combo bonus). A clear with a neon block is worth NEON_MULT times as much.
function scoreMove(placedN,steps){
  let gained=placedN, lines=0, chain=0, neon=0;
  steps.forEach(function(s){
    if(s.kind!=='clear') return;
    chain++; lines+=s.lines;
    let g=lineScore(s.lines)+2*s.extra;
    if(s.neon>0){ g*=NEON_MULT; neon++; }
    gained+=g;

let LANG='ru';
function detectLang(){
  try{
    const l=(navigator.language||'en').toLowerCase();
    if(/^(ru|uk|be|kk)/.test(l)) return 'ru';
    const two=l.slice(0,2);
    return STR[two]?two:'en';
  }catch(e){ return 'en'; }
}
function t(k,p){
  let s=(STR[LANG]&&STR[LANG][k]);
  if(s===undefined) s=STR.en[k];
  if(s===undefined) s=STR.ru[k];
  if(s===undefined) return k;
  if(p) s=s.replace(/\{(\w+)\}/g,function(_,x){ return p[x]!==undefined?p[x]:'{'+x+'}'; });
  return s;
}
function applyI18n(root){
  (root||document).querySelectorAll('[data-i]').forEach(function(el){ el.textContent=t(el.getAttribute('data-i')); });
  (root||document).querySelectorAll('[data-ia]').forEach(function(el){ el.setAttribute('aria-label',t(el.getAttribute('data-ia'))); });
  document.documentElement.setAttribute('lang',LANG);
}

// ===== store.js =====
// Profile, record tiers and the optional cloud copy of the profile.
const GOAL=100000;
// every tier is a rank title (rk0..rk8) and a background (bg0..bg8) unlocked by the best Classic score
const RANKS=[0,1000,5000,10000,50000,100000,250000,500000,1000000];
const MILESTONES=RANKS.filter(function(x){ return x>0&&x<=GOAL; });

const SKEY='trueblocks.v1';
// Inside the App Store / Google Play build the page runs in a Capacitor shell (window.TB_NATIVE is set there).
const NATIVE=!!(typeof window!=='undefined'&&window.TB_NATIVE);
function capPlugin(n){ try{ const C=window.Capacitor; return (C&&C.Plugins&&C.Plugins[n])||null; }catch(e){ return null; } }
// A phone may clear a web view's storage when space runs low: the native build keeps a second copy
// of the profile in the app's own preferences and brings it back on start.
async function nativeRestore(){
  const pr=capPlugin('Preferences'); if(!pr) return;
  try{
    if(lsGet(SKEY)) return;
    const r=await pr.get({key:SKEY});
    if(r&&typeof r.value==='string'&&r.value.length<2000000) lsSet(SKEY,r.value);
  }catch(e){}
}
let nativeSaveT=0;
function nativeBackup(){
  const pr=capPlugin('Preferences'); if(!pr) return;
  clearTimeout(nativeSaveT);
  nativeSaveT=setTimeout(function(){ try{ const v=lsGet(SKEY); if(v) pr.set({key:SKEY,value:v}); }catch(e){} },800);
}
const DICT_KEYS=new Set(['saves','tips','reached']);
let P=null;

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function rankOf(score){
  let r=0;
  for(let i=0;i<RANKS.length;i++) if(score>=RANKS[i]) r=i;
  return r;
}
function defaultProfile(){
  return {
    v:6, upd:0, tut:false, name:'',
    settings:{lang:null,sfx:true,music:true,sfxVol:0.9,musVol:0.55,haptics:true,cb:false},
    stats:{games:0,moves:0,lines:0,cells:[0,0,0],combo:0,chain:0,neon:0,fills:0,sec:0,zenSec:0},
    best:{classic:0,zen:0},
    streak:{n:0,best:0,last:0,days:''},
    // the Classic run with the best score, kept as seed + moves so the leaderboard can replay it
    bestRun:{score:0,seed:0,ts:0,mv:'',n:0,rv:0},
    goal:{reached:{}},
    tips:{}, saves:{classic:null,zen:null},
    lb:{sent:0,name:'',at:0}
  };
}
function mergeProfile(def,src){
  const out=JSON.parse(JSON.stringify(def));
  if(!src||typeof src!=='object') return out;
  Object.keys(src).forEach(function(k){
    if(!(k in out)) return;
    const d=out[k], s=src[k];
    if(s===null||s===undefined) return;
    if(Array.isArray(d)){ if(Array.isArray(s)) out[k]=d.map(function(x,i){ return typeof s[i]===typeof x?s[i]:x; }); }
    else if(d&&typeof d==='object'){
      if(typeof s==='object'&&!Array.isArray(s)) out[k]=DICT_KEYS.has(k)?s:mergeProfile(d,s);
    }else if(typeof d===typeof s) out[k]=s;
    else if(d===null&&(typeof s==='string'||typeof s==='object')) out[k]=s;
  });
  return out;
}

// ---------- cleaning whatever comes from storage or from the cloud ----------
function clampInt(x,lo,hi){ x=Math.floor(+x); if(!isFinite(x)) return lo; return x<lo?lo:x>hi?hi:x; }
// a nickname: no markup, no control or direction-changing characters, at most 16 symbols
function cleanName(s){
  s=String(s===undefined||s===null?'':s);
  let out='';
  for(const ch of s){
    const c=ch.codePointAt(0);
    if(c<32||(c>=127&&c<=159)||(c>=0x200b&&c<=0x200f)||(c>=0x2028&&c<=0x202e)||(c>=0x2060&&c<=0x2069)||c===0xfeff||c===60||c===62) continue;
    out+=ch;
  }
  out=out.replace(/\s+/g,' ').trim();
  return Array.from(out).slice(0,16).join('').trim();
}
function dayKey(d){ d=d||new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
function dayKeyOk(k){
  if(!(k>=20240101&&k<=20991231)) return false;
  const m=Math.floor(k/100)%100, d=k%100; return m>=1&&m<=12&&d>=1&&d<=31;
}
function dayNum(k){ return Math.round(Date.UTC(Math.floor(k/10000),(Math.floor(k/100)%100)-1,k%100)/86400000); }
function sanitizeProfile(p){
  const L=1e12;
  p.v=Logic.RULES_V; p.name=cleanName(p.name);
  const S=p.settings;
  S.sfxVol=Math.min(1,Math.max(0,+S.sfxVol||0)); S.musVol=Math.min(1,Math.max(0,+S.musVol||0));
  if(S.lang!==null&&!(typeof S.lang==='string'&&STR[S.lang])) S.lang=null;
  ['sfx','music','haptics','cb'].forEach(function(k){ S[k]=!!S[k]; });
  ['games','moves','lines','combo','chain','neon','fills','sec','zenSec'].forEach(function(k){ p.stats[k]=clampInt(p.stats[k],0,L); });
  p.stats.cells=p.stats.cells.map(function(x){ return clampInt(x,0,L); });
  p.best.classic=clampInt(p.best.classic,0,1e9); p.best.zen=clampInt(p.best.zen,0,1e9);
  const g=p.streak;
  g.n=clampInt(g.n,0,36500); g.best=Math.max(g.n,clampInt(g.best,0,36500)); g.last=dayKeyOk(g.last|0)?(g.last|0):0;
  g.days=String(g.days).split(',').map(Number).filter(dayKeyOk).slice(-28).join(',');
  if(!g.last){ g.n=0; }
  const b=p.bestRun, codes=Logic.decodeLog(b.mv);
  if(!codes||codes.length!==(b.n|0)||b.rv!==Logic.RULES_V||!(b.seed>=0&&b.seed<4294967296)||clampInt(b.score,0,1e9)!==b.score||b.score<=0){
    p.bestRun={score:0,seed:0,ts:0,mv:'',n:0,rv:0};
  }
  p.lb.sent=clampInt(p.lb.sent,0,1e9); p.lb.name=cleanName(p.lb.name); p.lb.at=clampInt(p.lb.at,0,4e12);
  p.upd=clampInt(p.upd,0,4e12);
  return p;
}
function loadProfile(){
  let p=null;
  const raw=lsGet(SKEY);
  if(raw){ try{ p=JSON.parse(raw); }catch(e){ p=null; } }
  P=sanitizeProfile(mergeProfile(defaultProfile(),p));
  if(!raw){
    // carry over the sound and language choices from the earlier version of the game
    try{
      const old=JSON.parse(lsGet('blockboom.v3')||'null');
      if(old&&old.settings){
        const s=old.settings, o=P.settings;
        if(typeof s.lang==='string') o.lang=s.lang;
        ['sfx','music','haptics'].forEach(function(k){ if(typeof s[k]==='boolean') o[k]=s[k]; });
        ['sfxVol','musVol'].forEach(function(k){ if(typeof s[k]==='number') o[k]=s[k]; });
        P.tut=!!old.tut;
      }
    }catch(e){}
  }
  return P;
}
function save(){
  try{
    P.upd=Date.now();
    lsSet(SKEY,JSON.stringify(P));
  }catch(e){}
  if(NATIVE) nativeBackup();
  cloudDirty();
}

// ---------- the signed-in viewer (db + user capabilities): optional, the game works without them ----------
const Net={db:null,user:null,uid:null,ready:false,p:null};
function netInit(){
  if(Net.p) return Net.p;
  Net.p=(async function(){
    try{
      if(!window.claude||!window.claude.use) return false;
      const db=await window.claude.use('db'), user=await window.claude.use('user');
      if(!db||!user) return false;
      const uid=await user.id();
      if(!uid) return false;
      Net.db=db; Net.user=user; Net.uid=String(uid); Net.ready=true;
      lsSet('tb.uid',Net.uid);
      return true;
    }catch(e){ return false; }
  })();
  return Net.p;
}
function netCanWrite(){
  if(!Net.ready) return false;
  try{ const v=Net.user.can('data.write'); return v!==false; }catch(e){ return true; }
}

// ---------- cloud copy of the profile ----------
const Cloud={on:false,ref:null,timer:0,writing:false,pending:false};
async function cloudInit(onAdopt){
  try{
    if(!(await netInit())) return;
    Cloud.ref=Net.db.doc('data/users/'+Net.uid+'/profile');
    const snap=await Cloud.ref.get();
    Cloud.on=true;
    if(snap.exists){
      const d=snap.data();
      // a stored time in the far future would win over every local save for ever: ignore it
      if(d&&typeof d.json==='string'&&d.json.length<400000&&(Number(d.upd)||0)>(Number(P.upd)||0)&&(Number(d.upd)||0)<Date.now()+864e5){
        const rp=JSON.parse(d.json);
        if(rp&&rp.v>=4){
          P=sanitizeProfile(mergeProfile(defaultProfile(),rp)); P.upd=Number(d.upd)||0;
          lsSet(SKEY,JSON.stringify(P));
          if(onAdopt) onAdopt();
          return;
        }
      }
    }
    if(P.upd) cloudPush();
  }catch(e){ Cloud.on=false; }
}
function cloudDirty(){
  if(!Cloud.on) return;
  clearTimeout(Cloud.timer);
  Cloud.timer=setTimeout(cloudPush,6000);
}
async function cloudPush(){
  if(!Cloud.on||!Cloud.ref) return;
  if(Cloud.writing){ Cloud.pending=true; return; }
  Cloud.writing=true;
  try{ await Cloud.ref.set({upd:P.upd,json:JSON.stringify(P)}); }
  catch(e){ if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='quota_exceeded'||e.code==='not_granted')) Cloud.on=false; }
  Cloud.writing=false;
  if(Cloud.pending){ Cloud.pending=false; cloudDirty(); }
}
function resetProfile(){
  const s=P.settings, nm=P.name;
  P=defaultProfile(); P.settings=s; P.name=nm; P.tut=true;
  save();
}

// Sound: synthesized effects with reverb, plus a slow generative music bed.
let AC=null, master=null, sfxBus=null, musBus=null, revS=null, revM=null, noiseBuf=null;
let lastLand=0, lastSnap=0, gestured=false;
function markGesture(){ gestured=true; }

function makeReverb(sec,decay,wet,dest){
  const conv=AC.createConvolver(), len=Math.floor(AC.sampleRate*sec), ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=ir.getChannelData(ch); let lp=0;
    for(let i=0;i<len;i++){ lp+=((Math.random()*2-1)-lp)*0.55; d[i]=lp*Math.pow(1-i/len,decay); }
  }
  conv.buffer=ir;
  const inp=AC.createGain(), w=AC.createGain(); w.gain.value=wet;
  inp.connect(conv); conv.connect(w); w.connect(dest);
  return inp;
}
function ensureAudio(){
  if(!gestured||!P||(!P.settings.sfx&&!P.settings.music)) return null;
  try{
    if(!AC){
      const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
      AC=new C();
      master=AC.createGain(); master.gain.value=0.9;
      const comp=AC.createDynamicsCompressor();
      comp.threshold.value=-16; comp.knee.value=18; comp.ratio.value=3.5; comp.attack.value=0.005; comp.release.value=0.25;
      master.connect(comp); comp.connect(AC.destination);
      sfxBus=AC.createGain(); sfxBus.connect(master);
      musBus=AC.createGain(); musBus.connect(master);
      revS=makeReverb(1.6,2.6,0.36,sfxBus);
      revM=makeReverb(3.4,2.0,0.55,musBus);
      noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*2),AC.sampleRate);
      const nd=noiseBuf.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
      applyVolumes();
    }
    if(AC.state==='suspended') AC.resume();
  }catch(e){ return null; }
  return AC;
}
function applyVolumes(){
  if(!AC) return;
  const t=AC.currentTime;
  sfxBus.gain.setTargetAtTime(P.settings.sfx?P.settings.sfxVol:0,t,0.05);
  musBus.gain.setTargetAtTime(P.settings.music?P.settings.musVol*0.6:0,t,0.25);
}
function route(a,g,o){
  let out=g;
  if(o.pan!==undefined&&a.createStereoPanner){ const pn=a.createStereoPanner(); pn.pan.value=o.pan; g.connect(pn); out=pn; }
  out.connect(o.mus?musBus:sfxBus);
  if(o.rev){ const s=a.createGain(); s.gain.value=o.rev; out.connect(s); s.connect(o.mus?revM:revS); }
}
function sfxOn(o){ return o&&o.mus?P.settings.music:P.settings.sfx; }
function V(type,f0,f1,at,dur,vol,o){
  o=o||{};
  if(!sfxOn(o)) return;
  const a=ensureAudio(); if(!a) return;
  try{
    const t=a.currentTime+at, osc=a.createOscillator(), g=a.createGain();
    osc.type=type; osc.frequency.setValueAtTime(f0,t);
    if(f1&&f1!==f0) osc.frequency.exponentialRampToValueAtTime(f1,t+dur*(o.sw||1));
    if(o.det) osc.detune.value=o.det;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+(o.atk||0.008));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    let out=osc;
    if(o.lp){ const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(o.lp,t); if(o.lp2) f.frequency.exponentialRampToValueAtTime(o.lp2,t+dur); osc.connect(f); out=f; }
    out.connect(g); route(a,g,o);
    osc.start(t); osc.stop(t+dur+0.05);
  }catch(e){}
}
function NZ(ftype,f0,f1,at,dur,vol,o){
  o=o||{};
  if(!sfxOn(o)) return;
  const a=ensureAudio(); if(!a||!noiseBuf) return;
  try{
    const t=a.currentTime+at, src=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
    src.buffer=noiseBuf; src.loop=true;
    f.type=ftype; f.Q.value=o.q||0.8; f.frequency.setValueAtTime(f0,t);
    if(f1&&f1!==f0) f.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+Math.min(o.atk||0.03,dur*0.4));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f); f.connect(g); route(a,g,o);
    src.start(t,Math.random()*0.8); src.stop(t+dur+0.05);
  }catch(e){}
}

const MOODS={

const CHORD_LEN=9;
const Music={
  running:false,timer:0,chordAt:0,pluckAt:0,ci:0,energy:0,wash:null,
  start:function(){
    if(this.running||!P.settings.music) return;
    const a=ensureAudio(); if(!a) return;
    this.running=true;
    const now=a.currentTime;
    this.chordAt=now+0.3; this.pluckAt=now+3; this.ci=0;
    const self=this;
    this.timer=setInterval(function(){ self.tick(); },400);
    this.tick();
  },
  stop:function(){
    this.running=false; clearInterval(this.timer);
  },

  pad:function(at,notes){
    const a=AC, lp=a.createBiquadFilter(), g=a.createGain();

    lp.connect(g); g.connect(musBus);
    const s=a.createGain(); s.gain.value=0.8; g.connect(s); s.connect(revM);
    notes.forEach(function(m,k){
      const f=mtof(m);

        const o=a.createOscillator(), og=a.createGain();
        o.type=x[0]; o.frequency.value=f; o.detune.value=x[1]+(k%2?-3:3);

  },
  pluck:function(at,midi,vel,pan){
    const rel=Math.max(0,at-AC.currentTime), f=mtof(midi);
    V('sine',f,0,rel,2.0,vel,{mus:true,rev:0.9,pan:pan,atk:0.004});
    V('sine',f*2.003,0,rel,0.9,vel*0.22,{mus:true,rev:0.6,pan:pan,atk:0.003});
    V('triangle',f*0.5,0,rel,0.7,vel*0.18,{mus:true,atk:0.01});
  },
  tick:function(){
    const a=AC; if(!a||!this.running||!P.settings.music) return;
    const now=a.currentTime, M=MOODS.bright, root=50;
    this.energy=Math.max(0,this.energy-0.025);
    while(this.chordAt<now+2.5){
      const ch=M.chords[this.ci%M.chords.length];
      this.pad(this.chordAt,ch.map(function(x){ return root+x; }).concat([root-12+ch[0]]));
      this.ci++; this.chordAt+=CHORD_LEN;
    }
    while(this.pluckAt<now+1.4){
      const deg=M.scale[Math.floor(Math.random()*M.scale.length)], oct=Math.random()<0.35?12:0;
      const midi=root+24+deg+oct, pan=(Math.random()*2-1)*0.6;
      this.pluck(this.pluckAt,midi,0.05+this.energy*0.035,pan);
      if(Math.random()<0.22+this.energy*0.35){
        const d2=M.scale[Math.floor(Math.random()*M.scale.length)];
        this.pluck(this.pluckAt+0.3,root+24+d2+oct,0.04+this.energy*0.03,-pan);
      }
      this.pluckAt+=(1.5+Math.random()*2.3)/(1+this.energy*1.7);
    }
  }
};
function audioPause(){ try{ if(AC&&AC.state==='running') AC.suspend(); }catch(e){} }
function audioResume(){ try{ if(AC&&AC.state==='suspended'&&(P.settings.sfx||P.settings.music)) AC.resume(); }catch(e){} }

// Procedural material textures: sand (grains with relief), slime (gel with bubbles), cut gems and neon tubes.
// Every sprite is drawn once on a canvas at start-up and handed to CSS as a background image.
const Mat=(function(){
'use strict';

const SIZE=128;

function clamp(x,a,b){ return x<a?a:x>b?b:x; }
function mixc(a,b,t){ return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]; }
function css(a,al){ return 'rgba('+Math.round(a[0])+','+Math.round(a[1])+','+Math.round(a[2])+','+(al===undefined?1:al)+')'; }
function hex(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function hash2(x,y,s){
  let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,2147483629))|0;
  h=Math.imul(h^(h>>>13),1274126177); h^=h>>>16;
  return (h>>>0)/4294967296;
}
function vnoise(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s), b=hash2(xi+1,yi,s), c=hash2(xi,yi+1,s), d=hash2(xi+1,yi+1,s);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function rng32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
// signed distance to a rounded square that fills the sprite (negative inside)
function sdfRR(x,y,S,r){
  const px=Math.abs(x-S/2)-(S/2-r), py=Math.abs(y-S/2)-(S/2-r);
  const ox=Math.max(px,0), oy=Math.max(py,0);
  return Math.sqrt(ox*ox+oy*oy)+Math.min(Math.max(px,py),0)-r;
}
function rrPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

// colours used by particles and flashes: [main, light, dark] as css strings
function pal(mat,color){
  if(mat===0){ const p=SLIME[color%SLIME.length]; return [css(p.mid),css(p.light),css(p.deep)]; }
  if(mat===1){ const p=SAND[color%SAND.length]; return [css(p.base),css(p.light),css(p.dark)]; }
