// ---------------------------------------------------------------- sand
function paintSand(ctx,S,p,seed){
  const img=ctx.createImageData(S,S), d=img.data;
  const k=128/S, R=S*0.16;
  const H=new Float32Array(S*S);
  const rnd=rng32(seed*7919+13);
  const pebbles=[];
  for(let q=0;q<5;q++) pebbles.push({x:rnd()*S,y:rnd()*S,r:(1.6+rnd()*2.6)/k,t:rnd()});
  const rip=rnd()*6.28;
  for(let y=0;y<S;y++) for(let x=0;x<S;x++){
    const u=x*k, v=y*k;
    let h=0.6*vnoise(u/1.7,v/1.7,seed+1)+0.34*vnoise(u/3.2,v/3.2,seed+2)+0.3*vnoise(u/7,v/7,seed+3);
    h+=0.07*Math.sin((u*0.22+v*0.11)+rip+4*vnoise(u/20,v/20,seed+4));
    for(let q=0;q<pebbles.length;q++){
      const pb=pebbles[q], dx=x-pb.x, dy=y-pb.y, dd=(dx*dx+dy*dy)/(pb.r*pb.r);
      if(dd<4) h+=0.9*Math.exp(-dd*1.2);
    }
    H[y*S+x]=h;
  }
  const L=[-0.62,-0.62];
  for(let y=0;y<S;y++) for(let x=0;x<S;x++){
    const sd=sdfRR(x+0.5,y+0.5,S,R);
    const a=clamp(0.5-sd,0,1);
    const o=(y*S+x)*4;
    if(a<=0){ d[o+3]=0; continue; }
    const xm=Math.max(0,x-1), xp=Math.min(S-1,x+1), ym=Math.max(0,y-1), yp=Math.min(S-1,y+1);
    const gx=(H[y*S+xp]-H[y*S+xm])*0.5, gy=(H[yp*S+x]-H[ym*S+x])*0.5;
    const relief=clamp(-(gx*L[0]+gy*L[1])*3.2,-1,1);
    const u=x*k, v=y*k;
    const g=hash2(Math.floor(u/1.5),Math.floor(v/1.5),seed);
    let col=mixc(p.dark,p.light,Math.pow(g,1.15)*0.85+0.1*vnoise(u/9,v/9,seed+5));
    // grains that are tinted a little differently, like mixed minerals
    const tint=hash2(Math.floor(u/2.8),Math.floor(v/2.8),seed+11);
    if(tint>0.78) col=mixc(col,p.base,0.55);
    const sp=hash2(Math.floor(u/1.2),Math.floor(v/1.2),seed+9);
    if(sp>0.982) col=mixc(col,p.spk,0.9);
    else if(sp<0.03) col=mixc(col,p.dark,0.7);
    let shade=0.72+0.55*relief+0.12*(vnoise(u/22,v/22,seed+6)-0.5);
    // pebbles
    for(let q=0;q<pebbles.length;q++){
      const pb=pebbles[q], dx=x-pb.x, dy=y-pb.y, dd=(dx*dx+dy*dy)/(pb.r*pb.r);
      if(dd<1){ col=mixc(col,mixc(p.base,p.light,pb.t),0.55*(1-dd)); }
    }
    // dome and rim
    const cx=(x/S-0.4), cy=(y/S-0.36);
    shade*=1.12-0.5*(cx*cx+cy*cy);
    const e=clamp(1+sd/(S*0.075),0,1);
    if(e>0){
      const nx=(sdfRR(x+1.5,y+0.5,S,R)-sdfRR(x-0.5,y+0.5,S,R)), ny=(sdfRR(x+0.5,y+1.5,S,R)-sdfRR(x+0.5,y-0.5,S,R));
      const nl=Math.sqrt(nx*nx+ny*ny)||1;
      const facing=-(nx*L[0]+ny*L[1])/nl/0.88;       // +1: edge faces the light
      shade*=1+e*e*(facing>0?0.22*facing:0.55*facing);
    }
    d[o]=clamp(col[0]*shade,0,255); d[o+1]=clamp(col[1]*shade,0,255); d[o+2]=clamp(col[2]*shade,0,255); d[o+3]=Math.round(255*a);
  }
  ctx.putImageData(img,0,0);
}

// ---------------------------------------------------------------- slime
function paintSlime(ctx,S,p,seed){
  const rnd=rng32(seed*104729+7);
  const m=S*0.04, R=S*0.27;
  ctx.save();
  rrPath(ctx,m,m,S-2*m,S-2*m,R);
  ctx.clip();
  // body: thick gel is lighter where light passes through and deep towards the rim
  let g=ctx.createRadialGradient(S*0.44,S*0.38,S*0.03,S*0.5,S*0.5,S*0.78);
  g.addColorStop(0,css(mixc(p.light,p.mid,0.15)));
  g.addColorStop(0.38,css(mixc(p.mid,p.light,0.18)));
  g.addColorStop(0.78,css(mixc(p.mid,p.deep,0.45)));
  g.addColorStop(1,css(p.deep));
  ctx.fillStyle=g; ctx.fillRect(0,0,S,S);
  // volume: the gel is thicker at the bottom-left, so it is darker there
  g=ctx.createRadialGradient(S*0.26,S*0.82,0,S*0.26,S*0.82,S*0.55);
  g.addColorStop(0,css(p.deep,0.55)); g.addColorStop(1,css(p.deep,0));
  ctx.fillStyle=g; ctx.fillRect(0,0,S,S);
  // light travelling through the gel and coming out at the lower right (caustic)
  g=ctx.createRadialGradient(S*0.68,S*0.72,0,S*0.68,S*0.72,S*0.46);
  g.addColorStop(0,css(mixc(p.glow,[255,255,255],0.25),0.85)); g.addColorStop(0.5,css(p.glow,0.35)); g.addColorStop(1,css(p.glow,0));
  ctx.fillStyle=g; ctx.fillRect(0,0,S,S);
  // darker thickness near the edge
  ctx.lineWidth=S*0.11; ctx.strokeStyle=css(p.deep,0.55);
  rrPath(ctx,m,m,S-2*m,S-2*m,R); ctx.stroke();
  // suspended bubbles, some big, many tiny
  const nb=11+Math.floor(rnd()*5);
  for(let q=0;q<nb;q++){
    const r=S*(0.01+Math.pow(rnd(),2.6)*0.07);
    const x=S*(0.15+rnd()*0.7), y=S*(0.18+rnd()*0.68);
    const bg=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
    bg.addColorStop(0,css(p.light,0.04)); bg.addColorStop(0.7,css(p.light,0.14)); bg.addColorStop(1,css(p.deep,0.5));
    ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();
    ctx.lineWidth=Math.max(0.8,r*0.16); ctx.strokeStyle='rgba(255,255,255,0.42)'; ctx.beginPath(); ctx.arc(x,y,r*0.92,3.4,5.6); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(x-r*0.38,y-r*0.42,Math.max(0.8,r*0.28),0,6.2832); ctx.fill();
    ctx.lineWidth=Math.max(0.6,r*0.12); ctx.strokeStyle=css(p.glow,0.5); ctx.beginPath(); ctx.arc(x,y,r*0.78,0.3,1.5); ctx.stroke();
  }
  // wet reflections
  ctx.save();
  ctx.translate(S*0.3,S*0.26); ctx.rotate(-0.55);
  g=ctx.createLinearGradient(-S*0.2,0,S*0.2,0);
  g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(0.3,'rgba(255,255,255,0.97)'); g.addColorStop(1,'rgba(255,255,255,0.08)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,0,S*0.21,S*0.058,0,0,6.2832); ctx.fill();
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.beginPath(); ctx.arc(S*0.16,S*0.41,S*0.024,0,6.2832); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(S*0.19,S*0.5,S*0.012,0,6.2832); ctx.fill();
  // secondary window reflection
  ctx.fillStyle='rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.ellipse(S*0.74,S*0.3,S*0.05,S*0.022,0.6,0,6.2832); ctx.fill();
  // bottom-right refraction crescent
  ctx.lineWidth=S*0.05; ctx.lineCap='round'; ctx.strokeStyle=css(mixc(p.light,p.glow,0.5),0.55);
  ctx.beginPath(); ctx.arc(S*0.5,S*0.5,S*0.375,0.12,1.4); ctx.stroke();
  ctx.lineWidth=S*0.018; ctx.strokeStyle='rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.arc(S*0.5,S*0.5,S*0.4,0.5,1.1); ctx.stroke();
  // rim light on the top edge
  ctx.lineWidth=S*0.022; ctx.strokeStyle='rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.moveTo(S*0.2,S*0.078); ctx.lineTo(S*0.62,S*0.078); ctx.stroke();
  ctx.restore();
  // soft contact edge
  ctx.lineWidth=S*0.014; ctx.strokeStyle=css(p.deep,0.9);
  rrPath(ctx,m,m,S-2*m,S-2*m,R); ctx.stroke();
}

// ---------------------------------------------------------------- gems
function octagon(S,inset,chamfer){
  const a=inset*S, b=(1-inset)*S, c=chamfer*S;
  return [[a+c,a],[b-c,a],[b,a+c],[b,b-c],[b-c,b],[a+c,b],[a,b-c],[a,a+c]];
}
// outward normal angle of octagon edge i (edge i joins point i and i+1): top, top-right, right, ...
const EDGE_ANG=[-90,-45,0,45,90,135,180,-135];
const LIGHT_ANG=-135;
function facet(ctx,pts,ang,tone,p,seed,idx){
  const rnd=hash2(idx,seed,5);
  let b=0.5+0.5*Math.cos((ang-LIGHT_ANG)*Math.PI/180);
  b=clamp(b*tone+(rnd-0.5)*0.5,0,1);
  b=b*b*(3-2*b);                                   // more contrast between lit and shaded facets
  if(hash2(idx,seed,13)>0.84) b*=0.35;             // a facet that reflects the dark surroundings
  const hi=hash2(idx,seed,9)>0.84;
  let lo=mixc(p.deep,p.mid,clamp(b*1.2,0,1)), up=mixc(p.mid,p.light,clamp(b*1.3-0.1,0,1));
  if(hi){ up=mixc(p.light,p.hi,0.7); lo=mixc(p.mid,p.light,0.6); }
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  pts.forEach(function(q){ x0=Math.min(x0,q[0]); y0=Math.min(y0,q[1]); x1=Math.max(x1,q[0]); y1=Math.max(y1,q[1]); });
  const dx=Math.cos(ang*Math.PI/180), dy=Math.sin(ang*Math.PI/180), cx=(x0+x1)/2, cy=(y0+y1)/2, hl=Math.max(x1-x0,y1-y0)/2+1;
  const g=ctx.createLinearGradient(cx-dx*hl,cy-dy*hl,cx+dx*hl,cy+dy*hl);
  g.addColorStop(0,css(up)); g.addColorStop(1,css(lo));
  ctx.beginPath(); pts.forEach(function(q,i){ if(i) ctx.lineTo(q[0],q[1]); else ctx.moveTo(q[0],q[1]); }); ctx.closePath();
  ctx.fillStyle=g; ctx.fill();
  ctx.lineWidth=0.9; ctx.strokeStyle=css(mixc(p.hi,p.light,0.3),0.42); ctx.stroke();
}
function ring(ctx,A,B,tone,p,seed,base){
  for(let i=0;i<8;i++){
    const j=(i+1)%8;
    facet(ctx,[A[i],A[j],B[j],B[i]],EDGE_ANG[i],tone*(i%2?0.92:1),p,seed,base+i);
  }
}
function paintGem(ctx,S,p,seed){
  const R=S*0.15;
  ctx.save();
  rrPath(ctx,0,0,S,S,R); ctx.clip();
  ctx.fillStyle=css(p.deep); ctx.fillRect(0,0,S,S);
  if(p.cut==='step'){
    const c=0.15;
    const o0=octagon(S,0.015,c), o1=octagon(S,0.135,0.125), o2=octagon(S,0.255,0.1), o3=octagon(S,0.375,0.075);
    ring(ctx,o0,o1,1.05,p,seed,0); ring(ctx,o1,o2,0.95,p,seed,10); ring(ctx,o2,o3,1.0,p,seed,20);
    tableOct(ctx,o3,p);
  }else if(p.cut==='princess'){
    const out=octagon(S,0.015,0.0), m1=octagon(S,0.1,0.0), mid=octagon(S,0.2,0.0);
    ring(ctx,out,m1,1.1,p,seed,0); ring(ctx,m1,mid,0.9,p,seed,10);
    const C=[S/2,S/2];
    // four long triangles of the pavilion, each cut into three layers
    const sq=[[S*0.2,S*0.2],[S*0.8,S*0.2],[S*0.8,S*0.8],[S*0.2,S*0.8]];
    const ang=[-90,0,90,180];
    const lerp=function(a,b,t){ return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]; };
    for(let i=0;i<4;i++){
      const a=sq[i], b2=sq[(i+1)%4];
      const a1=lerp(a,C,0.3), b1=lerp(b2,C,0.3), a2=lerp(a,C,0.62), b3=lerp(b2,C,0.62);
      facet(ctx,[a,b2,b1,a1],ang[i],1.05,p,seed,30+i);
      facet(ctx,[a1,b1,b3,a2],ang[i],0.8+0.35*hash2(i,seed,3),p,seed,40+i);
      facet(ctx,[a2,b3,C],ang[i],0.7+0.4*hash2(i,seed,4),p,seed,50+i);
    }
    // small diamond-shaped table
    const t=[[S*0.5,S*0.38],[S*0.62,S*0.5],[S*0.5,S*0.62],[S*0.38,S*0.5]];

// ---------- preview, drag and drop ----------

function ghostCells(piece,r0,c0,extra){

function canInteract(){ return !!R&&!R.over&&!busy&&!modalOpen&&curView==='game'; }
function onDown(e,i){
  if(!canInteract()||drag||!R.tray[i]) return;
  if(e.button!==undefined&&e.button>0) return;

  hideHand();
  const piece=R.tray[i];
  const rootEl=document.createElement('div'); rootEl.className='drag';
  rootEl.appendChild(makePiece(piece)); document.body.appendChild(rootEl);
  const w=piece.shape.w, h=piece.shape.h, pw=w*CELL+(w-1)*GAP, ph=h*CELL+(h-1)*GAP;
  const sr=slots[i].getBoundingClientRect();

  drag={i:i,piece:piece,root:rootEl,w:w,h:h,pw:pw,ph:ph,px:sx,py:sy,tx:sx,ty:sy,sc:TCELL/CELL,tsc:1,tilt:0,r0:0,c0:0,valid:false,dead:false,returning:false};

function onMove(e){
  const d=drag; if(!d) return;

  const o=cells[0].getBoundingClientRect(), step=CELL+GAP;

function floatLoop(d){
  if(d.dead) return;
  const k=d.returning?0.3:0.5;
  const nx=d.px+(d.tx-d.px)*k, ny=d.py+(d.ty-d.py)*k;
  const vx=nx-d.px, vy=ny-d.py; d.px=nx; d.py=ny;
  d.tilt+=(Logic.clamp(vx*1.1,-16,16)-d.tilt)*0.25;
  d.sc+=(d.tsc-d.sc)*0.3;
  const sq=d.piece.mat===0?Logic.clamp(Math.hypot(vx,vy)*0.005,0,0.1):0;
  d.root.style.transform='translate3d('+nx+'px,'+ny+'px,0) rotate('+(d.returning?0:d.tilt)+'deg) scale('+(d.sc*(1-sq))+','+(d.sc*(1+sq))+')';
  if(d.returning&&Math.abs(d.tx-nx)+Math.abs(d.ty-ny)<1.2&&Math.abs(d.tsc-d.sc)<0.03){
    d.dead=true; d.root.remove(); slots[d.i].classList.remove('lifted'); return;

function onUp(){ finishDrag(true); }

    const tg=TUT[R.tutStep].target;

// ---------- run state ----------
function packPiece(p){ return p?{s:p.shape.id,c:p.color,m:p.mat,n:hasNeon(p)?p.neon:-1,h:p.nc|0}:null; }
function unpackPiece(d){
  if(!d||typeof d!=='object'||!Logic.SHAPES[d.s]) return null;
  const m=d.m|0, c=d.c|0;
  if(!(m>=0&&m<=2)||!(c>=0&&c<Logic.NCOLORS[m])) return null;
  const p={shape:Logic.SHAPES[d.s],color:c,mat:m};
  if(d.n>=0&&d.n<p.shape.n){ p.neon=d.n|0; p.nc=clampInt(d.h,0,Logic.NCOLORS[4]-1); p.seen=true; }
  return p;
}
function newSeed(){
  const ts=Date.now();
  const uid=Net.uid||lsGet('tb.uid');
  if(uid) return {seed:Logic.seedFor(uid,ts),ts:ts,elig:true};
  return {seed:(Math.random()*4294967296)>>>0,ts:ts,elig:false};
}
function mkRun(mode){
  const sd=newSeed();
  const r=Logic.newRun(mode,sd.seed);
  r.ts=sd.ts; r.elig=sd.elig&&mode==='classic'&&DBG.neonP===undefined; r.neonP=DBG.neonP;
  r.over=false; r.bestBefore=0; r.sec=0; r.tutStep=0; r.stuckTimer=0; r.recordShown=false; r.justDone=false;
  r.stats=Logic.newRunStats();
  if(mode==='classic') r.bestBefore=P.best.classic|0;
  else if(mode==='zen') r.bestBefore=P.best.zen|0;
  return r;
}
function genTray(r){ return Logic.dealFor(r); }
function statsOf(s){ return {score:s.score|0,lines:s.lines|0,cleared:[0,1,2].map(function(k){ return (s.cleared&&s.cleared[k])|0; }),neon:s.neon|0}; }
function serializeRun(r){
  return {mode:r.mode,grid:r.grid.slice(),tray:r.tray.map(packPiece),score:r.score,combo:r.combo,misses:r.misses,moves:r.moves,peak:r.peak,
    stats:statsOf(r.stats),trayN:r.trayN,sec:r.sec,recordShown:r.recordShown,
    seed:r.seed>>>0,ts:r.ts,rs:r.rng.get(),lg:Logic.encodeLog(r.log||[]),el:r.elig?1:0,v:Logic.RULES_V};
}
// whatever is in storage may have been edited by hand: a save that does not look exactly right is dropped
function cellOk(v){
  if(typeof v!=='number'||v!==Math.floor(v)||v<0) return false;
  if(v===0) return true;
  const m=matOf(v), c=colOf(v);
  return (m===0||m===1||m===2||m===4)&&c>=0&&c<Logic.NCOLORS[m];
}
function restoreRun(d){
  try{
    if(!d||typeof d!=='object'||!Array.isArray(d.grid)||d.grid.length!==CELLS||!Array.isArray(d.tray)||d.tray.length!==3) return null;
    if(d.mode!=='zen'&&d.mode!=='classic') return null;
    if(!d.grid.every(cellOk)) return null;
    const r=mkRun(d.mode);
    r.grid=d.grid.slice();
    r.tray=d.tray.map(unpackPiece);
    for(let k=0;k<3;k++) if(d.tray[k]&&!r.tray[k]) return null;
    [['score',1e9],['combo',1e6],['misses',Logic.COMBO_GRACE-1],['moves',1e6],['peak',1e6],['trayN',1e6],['sec',1e9]].forEach(function(q){
      if(typeof d[q[0]]==='number'&&isFinite(d[q[0]])) r[q[0]]=clampInt(d[q[0]],0,q[1]);
    });
    r.recordShown=!!d.recordShown;
    if(d.stats&&typeof d.stats==='object') r.stats=statsOf(d.stats);
    // the random stream continues exactly where it stopped, so the run can still be replayed
    const codes=Logic.decodeLog(d.lg);
    if(d.v===Logic.RULES_V&&typeof d.seed==='number'&&typeof d.rs==='number'&&codes&&codes.length===r.moves){
      r.seed=d.seed>>>0; r.rng=Logic.makeRng(r.seed); r.rng.set(d.rs|0);
      r.ts=clampInt(d.ts,0,4e12); r.log=codes; r.elig=d.mode==='classic'&&d.el===1&&DBG.neonP===undefined;
    }else{
      r.log=[]; r.elig=false;      // an older save: it can be finished, but it is not a leaderboard run
    }
    if(!r.tray.some(function(x){ return x; })){ r.tray=Logic.dealFor(r); r.trayN++; }
    return r;
  }catch(e){ return null; }
}
function persistRun(){
  if(!R||R.over||R.mode==='tut') return;
  P.saves[R.mode]=serializeRun(R);
  save();
}
// The best Classic run is kept with its seed and moves: that is what the leaderboard checks.
function recordBest(r){
  if(!r||r.mode!=='classic') return;
  if(r.score>(P.best.classic|0)) P.best.classic=r.score;
  if(r.elig&&r.moves>0&&r.log&&r.log.length===r.moves&&r.score>(P.bestRun.score|0)){
    P.bestRun={score:r.score,seed:r.seed>>>0,ts:r.ts,mv:Logic.encodeLog(r.log),n:r.moves,rv:Logic.RULES_V};
  }
}
function commitBest(r){
  if(!r) return;
  if(r.mode==='classic') recordBest(r);
  else if(r.mode==='zen'&&r.score>(P.best.zen|0)) P.best.zen=r.score;

// ---------- scoring and the 100 000 goal ----------
function summarize(steps){
  const s={lines:0,clears:0,extra:0,cells:[0,0,0],blob:0,res:0,maxStep:0,falls:0,neon:0};
  steps.forEach(function(st){
    if(st.kind==='fall'){ s.falls+=st.falls.length; return; }
    if(st.kind==='clear'){
      s.clears++; s.lines+=st.lines; s.maxStep=Math.max(s.maxStep,st.lines); s.extra+=st.extra;
      s.blob=Math.max(s.blob,st.blobMax); s.res+=st.resonance; s.neon+=st.neon;
    }
    if(st.kind==='clear'||st.kind==='hammer'){
      st.cleared.forEach(function(c){ if(c[2]<3) s.cells[c[2]]++; });
    }
  });
  return s;
}
// record tiers: crossing one with a new record switches the background right away
function checkScoreEvents(r,prev){
  if(r.mode!=='classic') return;
  if(!r.recordShown&&r.bestBefore>=500&&r.score>r.bestBefore){
    r.recordShown=true;
    setTimeout(function(){ if(R===r){ toast(t('new_record'),{kind:'good',icon:'crown',ms:2400}); sfx.best(); } },900);
  }
  const before=Math.max(prev,r.bestBefore);
  if(r.score<=before) return;
  const t0=rankOf(before), t1=rankOf(r.score);
  if(t1>t0){ recordBest(r); save(); onTier(t1); }
}
function onTier(k){

      toast(t('ms_legend'),{kind:'good',icon:'crown',ms:5200});

// the bar is drawn on a square-root scale so the early tiers (1 000, 5 000, 10 000) are visible steps
function goalPct(score){ return Math.min(100,100*Math.sqrt(Math.max(0,score)/GOAL)); }
// one encouraging line that also says how far the goal still is (html: the number is bold)
function motivation(score){

}


// ---------- streak of days ----------
// Playing at least one move on a calendar day extends the streak by one; skipping a whole day ends it.
function streakNow(){
  const S=P.streak;
  if(!S.last) return {n:0,today:false,risk:false};
  const gap=dayNum(dayKey())-dayNum(S.last);
  if(gap<=0) return {n:S.n,today:true,risk:false};
  if(gap===1) return {n:S.n,today:false,risk:true};
  return {n:0,today:false,risk:false};
}
function streakTouch(){
  const S=P.streak, k=dayKey();
  if(S.last===k) return;
  if(S.last&&dayNum(k)<dayNum(S.last)) return;        // the clock went back: nothing to count
  const gap=S.last?dayNum(k)-dayNum(S.last):9;
  S.n=gap===1?Math.min(36500,S.n+1):1;
  S.best=Math.max(S.best,S.n); S.last=k;
  const days=S.days?S.days.split(',').filter(Boolean):[];
  if(days.indexOf(String(k))<0) days.push(String(k));
  S.days=days.slice(-28).join(',');
  save();
  const n=S.n;
  setTimeout(function(){ if(R&&!R.over) streakFx(n); },1300);
}
function streakFx(n){
  toast(t('streak_toast',{n:n}),{kind:'good',icon:'flame',ms:3000,sub:t(n===1?'streak_new':'streak_keep')});
  sfx.win(); buzz([14,30,14]);
}
function streakTier(n){ return n>=100?5:n>=30?4:n>=14?3:n>=7?2:n>=3?1:0; }

// ---------- one move ----------
function commitMove(i,r0,c0){
  const r=R;
  const mv=Logic.applyMove(r,i,r0,c0);
  if(!mv) return;
  const p=mv.p, placed=mv.placed, afterPlace=mv.afterPlace, steps=mv.steps;
  const sum=summarize(steps);
  const gained=mv.gained, cb=mv.bonus, comboLost=mv.comboLost, perfect=mv.perfect, refilled=mv.refilled;
  const prev=r.score-gained;
  tallyMove(r,sum);
  if(r.mode!=='tut') streakTouch();
  const ctx={tok:++playTok,combo:mv.comboHit,bonus:cb,placed:placed,cr:0,cc:0,gained:gained,perfect:perfect,p:p,sum:sum};
  ctx.cr=placed.reduce(function(a,x){ return a+((x/N)|0); },0)/placed.length;
  ctx.cc=placed.reduce(function(a,x){ return a+(x%N); },0)/placed.length;
  const all=steps.concat(r.extra);
  persistRun();
  hideHand();
  paintBoard(afterPlace);
  if(comboLost) comboFizzle();
  const gone=new Set(); if(steps.length&&steps[0].kind==='clear') steps[0].cleared.forEach(function(x){ gone.add(x[0]); });
  placed.forEach(function(idx){ if(!gone.has(idx)) anim(cells[idx],'pop',400); });
  rippleAround(ctx.cr,ctx.cc,new Set(placed),afterPlace);
  const dust=placed.filter(function(x){ return !gone.has(x); });
  const dustCell=dust.length?dust[Math.floor(Math.random()*dust.length)]:placed[0];
  puff(cells[dustCell].getBoundingClientRect(),p.mat,p.color,Math.min(10,placed.length*3),CELL);
  if(!sum.lines&&!steps.length) { sfx.place(p.mat); buzz(8); }
  else buzz(sum.lines>=2?[18,30,28]:14);
  Music.bump(0.12*sum.lines+(sum.clears>1?0.25:0));
  checkScoreEvents(r,prev);
  updateHUD(true);
  const lock=steps.some(function(s){ return s.kind==='fall'; })||steps.filter(function(s){ return s.kind==='clear'; }).length>1||r.extra.length>0;
  if(!all.length){ reveal(r,refilled); return; }
  if(!lock){
    playSteps(all,afterPlace,ctx).catch(oops);
    reveal(r,refilled);
  }else{
    busy=true;
    // if an animation ever fails half way, the board must not stay locked
    const wd=setTimeout(function(){ if(busy&&R===r&&ctx.tok===playTok){ busy=false; paintBoard(r.grid); reveal(r,refilled); } },9000);
    playSteps(all,afterPlace,ctx).then(function(ok){
      clearTimeout(wd);
      busy=false;
      if(ok&&R===r) reveal(r,refilled);
    }).catch(function(e){ clearTimeout(wd); busy=false; oops(e); if(R===r){ paintBoard(r.grid); reveal(r,refilled); } });
  }
}
function tallyMove(r,sum){
  r.stats.score=r.score; r.stats.lines+=sum.lines; r.stats.neon+=sum.neon;
  for(let m=0;m<3;m++){ r.stats.cleared[m]+=sum.cells[m]; P.stats.cells[m]+=sum.cells[m]; }
  P.stats.moves++; P.stats.lines+=sum.lines; P.stats.neon+=sum.neon;
  P.stats.combo=Math.max(P.stats.combo|0,r.peak|0);
}
function stepGain(st){ return (Logic.lineScore(st.lines)+2*st.extra)*(st.neon>0?Logic.NEON_MULT:1); }

async function playSteps(steps,start,ctx){
  let cur=start.slice(), ci=0;
  for(let k=0;k<steps.length;k++){
    if(ctx.tok!==playTok) return false;
    const st=steps[k];
    if(st.kind==='fall'){
      await playFall(st,cur,ctx.tok);
      if(ctx.tok!==playTok) return false;
    }else{
      fxStep(st,cur,ctx,ci);
      paintBoard(st.after);
      if(st.kind==='clear') ci++;
      if(steps.length>1||st.kind!=='clear') await sleep(st.kind==='exhale'?1000:(st.neon>0?620:340));
    }
    cur=st.after.slice();
  }
  if(ctx.tok!==playTok) return false;
  if(ctx.perfect){ showBanner(t('w_perfect'),'+300'); sfx.best(); flashGlow(); shakeBoard(); }
  return true;
}
function fxStep(st,cur,ctx,idx){
  const mats=[0,0,0]; st.cleared.forEach(function(c){ if(c[2]<3) mats[c[2]]++; });
  let cr=ctx.cr, cc=ctx.cc;
  if(idx>0||st.kind!=='clear'){
    let sr=0, sc=0; st.cleared.forEach(function(c){ sr+=(c[0]/N)|0; sc+=c[0]%N; });
    const n=Math.max(1,st.cleared.length); cr=sr/n; cc=sc/n;
    if(st.kind==='hammer'&&st.centre!==undefined){ cr=(st.centre/N)|0; cc=st.centre%N; }
  }
  burstAll(st.cleared,cr,cc);
  if(st.kind==='clear'){
    const gain=stepGain(st)+(idx===0?ctx.placed.length:0);
    const neonCells=st.cleared.filter(function(c){ return c[2]===4; });
    if(neonCells.length){
      const hue=neonCells[0][1];
      neonCells.forEach(function(c){ const q=cellCentre(c[0]); neonBurst(q[0],q[1],neonCss(c[1]),54,CELL); });
      flashScreen(hue); flashGlow(hue); shakeBoard();
      showBanner(t('w_neon'),'×'+Logic.NEON_MULT+'  +'+fmt(gain),'neon',hue);
      floatPoints(st.cleared,'+'+fmt(gain),hue);
      sfx.neon(); buzz([20,40,20,40,120]); Music.bump(0.5);
      if(!P.tips.neon){ P.tips.neon=1; save(); }
    }else{
      if(idx===0){
        sfx.clear(st.lines,ctx.combo,mats);
        let word=st.lines>=4?t('w_insane'):st.lines===3?t('w_great'):st.lines===2?t('w_good'):(ctx.combo>=2?t('w_combo'):t('w_line'));
        if(st.lines<3&&st.blobMax>=8) word=t('w_blob');
        if(st.lines<3&&st.resonance>0) word=t('w_resonance');
        if(ctx.combo===Logic.COMBO_JACKPOT_AT){ jackpotFx(); showBanner(t('combo_max'),'+'+fmt(ctx.gained),'ms'); }
        else showBanner(word,'+'+fmt(ctx.gained)+(ctx.combo>=2?' · '+t('combo_n',{n:ctx.combo}):''));
        if(ctx.combo>=2) comboPulse(ctx.combo);
      }
      flashGlow();
      if(st.lines>=2||ctx.combo>=3) shakeBoard();
      floatPoints(st.cleared,'+'+fmt(gain+(ctx.bonus||0)));
    }
    if(st.resonance>0) resonanceFx(st);
  }else if(st.kind==='hammer'){
    sfx.hammer(); shakeBoard(); flashGlow();
  }else if(st.kind==='exhale'){
    sfx.exhale(); showBanner(t('zen_exhale'),''); flashGlow();
  }
}
async function playFall(st,cur,tok){
  const falls=st.falls;
  const g2=cur.slice(); falls.forEach(function(f){ g2[f.from]=0; });
  paintBoard(g2);
  const step=CELL+GAP;
  let maxDur=0;
  falls.forEach(function(f){
    const d=((f.to/N)|0)-((f.from/N)|0);
    const dur=Math.round(105*Math.sqrt(d)+70);
    maxDur=Math.max(maxDur,dur);
    const el=document.createElement('div'); el.className='fx fall m'+matOf(f.v)+' c'+colOf(f.v);
    const src=cells[f.from];
    el.style.left=src.offsetLeft+'px'; el.style.top=src.offsetTop+'px'; el.style.width=src.offsetWidth+'px'; el.style.height=src.offsetHeight+'px';
    board.appendChild(el);
    puff(src.getBoundingClientRect(),1,colOf(f.v),3,CELL);
    const a=el.animate([{transform:'translateY(0)'},{transform:'translateY('+(d*step)+'px)'}],{duration:dur,easing:'cubic-bezier(.55,.085,.68,.53)',fill:'forwards'});
    a.onfinish=function(){
      el.remove();
      if(tok!==playTok) return;
      setCellState(f.to,f.v,'land');
      const dest=cells[f.to];
      setTimeout(function(){ dest.classList.remove('land'); },330);
      puff(dest.getBoundingClientRect(),1,colOf(f.v),3+d,CELL);
      sfx.land();
    };
  });
  await sleep(maxDur+140);
  if(tok===playTok) paintBoard(st.after);
}
function reveal(r,refilled){

  updateHUD(true);
  renderTray(refilled);
  if(refilled) setTimeout(sfx.refill,160);

  checkEnd();
}
function checkEnd(){

}

// ---------- HUD ----------
function fitScore(){
  const n=scoreEl.textContent.length;
  scoreEl.style.fontSize=n>10?'24px':n>8?'28px':n>6?'32px':'';
}
function showScore(animate){
  cancelAnimationFrame(tween);
  const score=R?R.score:0;
  if(!animate){ shown=score; scoreEl.textContent=fmt(score); fitScore(); return; }
  const from=shown, to=score, t0=performance.now(), dur=Math.min(800,240+(to-from)*3);
  const step=function(ts){
    const k=Math.min(1,(ts-t0)/dur);
    shown=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));
    scoreEl.textContent=fmt(shown); fitScore();
    if(k<1) tween=requestAnimationFrame(step);
  };
  tween=requestAnimationFrame(step);
  if(to!==from){ scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump'); }
}
function ticksHtml(on){

// ---------- end of a run ----------
function meltdown(){
  const list=[];
  for(let i=0;i<CELLS;i++) if(R.grid[i]) list.push([i,colOf(R.grid[i]),matOf(R.grid[i])]);
  let maxD=0;
  const G=(list.length>24||lowFx())?4:5;
  list.forEach(function(it){
    const i=it[0], r=(i/N)|0, c=i%N, d=Math.round(r*70+c*12+Math.random()*120);
    maxD=Math.max(maxD,d);
    setCellState(i,0);
    burstCell(i,it[1],it[2],d,G);
  });
  return maxD;
}
function failRun(){
  const r=R; if(!r||r.over||r.mode!=='classic') return;
  r.over=true; hideStuck();
  P.saves.classic=null;
  const isNew=r.score>r.bestBefore&&r.score>0;
  commitBest(r);
  save();
  lbSubmitSoon(true);
  if(isNew) sfx.best(); else sfx.over();
  buzz([30,40,60]);
  const wait=meltdown()+900;
  setTimeout(function(){ if(R===r&&r.over) showOver(isNew); },wait);
}
function showOver(isNew){
  const r=R; if(!r) return;
  const best=Math.max(r.bestBefore,r.score);
  let h='<div class="ot">'+t('over_t')+'</div><div class="os">'+fmt(r.score)+'</div>';
  h+=isNew?'<div class="ob">'+t('new_best')+'</div>':'<div class="obest">'+t('best_n',{n:fmt(best)})+'</div>';
  h+='<div class="ogoal"><div class="gbar" id="o-bar"><i></i></div><p>'+motivation(best)+'</p></div>';
  h+='<div class="row"><button class="cta" data-act="again" type="button">'+t('again')+'</button></div>';
  if(window.TGX&&TGX.on){
    const ru=String(P.settings.lang||navigator.language||'ru').slice(0,2)==='ru';
    h+='<div class="row"><button class="ghostbtn" data-act="share" type="button">'+(ru?'📣 Бросить вызов':'📣 Challenge a friend')+'</button>'
      +(TGX.kb&&r.mode==='classic'&&r.elig&&r.log&&r.log.length===r.moves?'<button class="ghostbtn" data-act="totop" type="button">'+(ru?'🏆 В топ бота':'🏆 Send to top')+'</button>':'')+'</div>';

// ===== intro.js =====
// Opening: one dark grey "true." on a plain light page. A little grass grows out of the letters
// (with its rustle), then the word flies at the camera and the game opens. About two and a half seconds.
// Browsers only let a page make sound after a touch, so when sound is on the intro waits for one tap
// before the grass starts to grow.
const Intro=(function(){
  const el=$('intro'), stage=$('istage'), cv=$('icv'), tapEl=$('itap');
  let ctx=null, W=0, H=0, D=1, blades=[], text=null, raf=0, t0=0, growStart=-1, alive=true;
  const FONT='-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
  const GROW=1.2;            // seconds for the grass to come up

  function size(){
    W=window.innerWidth; H=window.innerHeight; D=Math.min(2,window.devicePixelRatio||1);
    cv.width=Math.round(W*D); cv.height=Math.round(H*D); cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx=cv.getContext('2d'); ctx.setTransform(D,0,0,D,0,0);
  }
  // lay out the word and find where grass can root: the upper edges of every letter
  function prepare(){
    const fs=Math.round(Math.min(W*0.3,H*0.2,190));
    const font='900 '+fs+'px '+FONT;
    ctx.font=font;
    const tw=ctx.measureText('true.').width;
    const x=(W-tw)/2, y=H*0.37;
    text={font:font,fs:fs,x:x,y:y,w:tw};
    stage.style.transformOrigin=(x+tw*0.5)/W*100+'% '+(y-fs*0.3)/H*100+'%';
    // mask at 1 px per css px
    const m=document.createElement('canvas'); m.width=W; m.height=H;
    const mc=m.getContext('2d'); mc.font=font; mc.textBaseline='alphabetic'; mc.fillStyle='#000'; mc.fillText('true.',x,y);
    const top=Math.max(0,Math.floor(y-fs*1.05)), bot=Math.min(H,Math.ceil(y+fs*0.1));
    const img=mc.getImageData(0,top,W,bot-top).data, rowW=W*4;
    const roots=[];
    for(let c=Math.floor(x-2);c<Math.ceil(x+tw+2);c++){
      if(c<0||c>=W) continue;
      // only the topmost surface of each column: grass grows up and out of the word, never inside a letter
      for(let r=1;r<bot-top;r++){
        if(img[(r*W+c)*4+3]>128){ roots.push([c,top+r]); break; }
      }
    }
    blades=[];
    const rnd=Math.random;
    const scale=fs/150;
    roots.forEach(function(p,k){
      if(k%2) return;                         // every other column: a light tuft, not a lawn
      const n=1+(rnd()<0.5?1:0);
      for(let q=0;q<n;q++){
        const h=(12+rnd()*30+(rnd()<0.12?16:0))*scale;
        blades.push({
          x:p[0]+(rnd()-0.5)*1.4, y:p[1]+1.5,
          h:h, w:(0.7+rnd()*0.8)*scale,
          lean:(rnd()-0.5)*0.7, bend:(rnd()-0.5)*0.8,
          ph:rnd()*6.28, sp:0.9+rnd()*0.9,
          delay:rnd()*0.5, dur:0.6+rnd()*0.5,
          tone:Math.floor(rnd()*3), hi:false, back:false
        });
      }
    });
  }
  // three flat greens
  const TONES=['#2b7a30','#38923e','#4cad4b'];
  function drawText(alpha){
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.font=text.font; ctx.textBaseline='alphabetic';
    ctx.fillStyle='#2a2c31'; ctx.fillText('true.',text.x,text.y);
    ctx.restore();
  }
  function bladePath(b,k,time){
    const h=b.h*k;
    if(h<0.5) return;
    const sway=Math.sin(time*b.sp+b.ph+b.x*0.02)*0.08*h+Math.sin(time*2.7+b.ph)*0.025*h;
    const tx=b.x+Math.sin(b.lean)*h+sway, ty=b.y-Math.cos(b.lean)*h;
    const cx=b.x+Math.sin(b.lean)*h*0.35+b.bend*h*0.35+sway*0.4, cy=b.y-h*0.55;
    const w=b.w*(0.6+0.4*k);
    ctx.moveTo(b.x-w,b.y);
    ctx.quadraticCurveTo(cx-w*0.6,cy,tx,ty);
    ctx.quadraticCurveTo(cx+w*0.6,cy,b.x+w,b.y);
  }
  function grassAt(time,back){
    const g=growStart<0?0:time-growStart;
    for(let tone=0;tone<TONES.length;tone++){
      ctx.beginPath();
      let any=false;
      for(let i=0;i<blades.length;i++){
        const b=blades[i];
        if(b.back!==back||b.tone!==tone) continue;
        const k=Math.max(0,Math.min(1,(g-b.delay)/b.dur));
        if(k<=0) continue;
        bladePath(b,1-Math.pow(1-k,3),time); any=true;
      }
      if(any){ ctx.fillStyle=TONES[tone]; ctx.fill(); }
    }
    if(back) return;
    // a thin sunlit edge on some blades
    ctx.beginPath();
    for(let i=0;i<blades.length;i++){
      const b=blades[i]; if(!b.hi) continue;
      const k=Math.max(0,Math.min(1,(g-b.delay)/b.dur)); if(k<=0.2) continue;
      const h=b.h*(1-Math.pow(1-k,3));
      const sway=Math.sin(time*b.sp+b.ph+b.x*0.02)*0.08*h+Math.sin(time*2.7+b.ph)*0.025*h;
      ctx.moveTo(b.x+b.w*0.2,b.y-h*0.2);
      ctx.quadraticCurveTo(b.x+Math.sin(b.lean)*h*0.35+b.bend*h*0.35+sway*0.4,b.y-h*0.55,b.x+Math.sin(b.lean)*h+sway,b.y-Math.cos(b.lean)*h);
    }
    ctx.strokeStyle='rgba(150,210,110,.22)'; ctx.lineWidth=0.6; ctx.stroke();
  }
  function frame(now){
    if(!alive) return;
    const time=(now-t0)/1000;
    ctx.clearRect(0,0,W,H);
    grassAt(time,true);
    drawText(Math.min(1,time/0.4));
    grassAt(time,false);
    raf=requestAnimationFrame(frame);
  }
  function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
  function needTap(){
    if(!P||(!P.settings.sfx&&!P.settings.music)) return false;
    return !gestured;
  }
  function tapOnce(){
    return new Promise(function(res){
      tapEl.hidden=false;
      const go=function(){ el.removeEventListener('pointerdown',go); tapEl.hidden=true; unlockAudio(); res(); };
      el.addEventListener('pointerdown',go);
    });
  }
  async function run(ready){
    size(); prepare();
    t0=performance.now();
    raf=requestAnimationFrame(frame);
    el.classList.add('on');
    await wait(450);
    if(needTap()) await tapOnce();
    growStart=(performance.now()-t0)/1000;
    sfx.grass(GROW+0.4);
    await wait(GROW*1000+350);
    try{ await ready; }catch(e){}
    sfx.whoosh();
    el.classList.add('zoom');
    await wait(650);
    el.classList.add('gone');
    await wait(500);
    alive=false; cancelAnimationFrame(raf);
    el.remove();
  }
  function skip(){ alive=false; cancelAnimationFrame(raf); el.remove(); }
  return {run:run, skip:skip};
})();

// ---------- toasts ----------
// one at a time, queued; in the game they sit over the thin status row so the score and the board stay visible
const toastQ=[]; let toastBusy=false;
function toast(text,o){
  o=o||{};
  if(o.kind==='tip'&&(toastQ.length>0||toastBusy)){ return false; }
  toastQ.push({text:text,o:o});
  while(toastQ.length>4){ const k=toastQ.findIndex(function(x){ return x.o.kind==='tip'||!x.o.kind; }); toastQ.splice(k<0?0:k,1); }
  toastNext();
  return true;
}
function toastNext(){
  if(toastBusy||!toastQ.length) return;
  const it=toastQ.shift(), o=it.o;
  toastBusy=true;
  const el=document.createElement('div'); el.className='toast'+(o.kind?' '+o.kind:'');
  el.innerHTML='<span class="ti">'+(o.icon?ico(o.icon,16):'')+'</span><div></div>';
  const body=el.lastChild; body.textContent=it.text;
  if(o.sub){ const s=document.createElement('small'); s.textContent=o.sub; body.appendChild(s); }
  toastsEl.appendChild(el);
  let top='';
  if(curView==='game'){
    const st=$('status').getBoundingClientRect();
    const h=el.offsetHeight||44;
    top=Math.max(6,Math.round(st.top+st.height/2-h/2))+'px';
  }
  toastsEl.style.top=top;
  let ms=o.ms||2600;
  if(toastQ.length) ms=Math.min(ms,1700);
  setTimeout(function(){
    el.classList.add('out');
    setTimeout(function(){ el.remove(); toastBusy=false; toastNext(); },280);
  },ms);
}

// ===== leaderboard.js =====
// Leaderboard on the db capability: one document per player at lb/<id>.
// A row is not just a score: it carries the seed of the run and every move. The game is deterministic,
// so any device can replay a row from the first move and see for itself whether it ends at the score
// that was claimed. Rows that do not replay to their score are never shown.
//   lb/<id> = {name, score, seed, ts, n, mv, rv, upd}
//   seed = hash(id, ts): a recorded run cannot be copied under another name
const LB={rows:null,sendT:0,sending:false,denied:false,last:0,tok:0,mem:{}};
const LB_FETCH=120, LB_SHOW=30, LB_MAX_MOVES=12000;

function lbName(){
  const n=cleanName(P.name);
  if(n) return n;
  return t('player')+(Net.uid?' '+String(Net.uid).replace(/[^A-Za-z0-9]/g,'').slice(-4).toUpperCase():'');
}
function lbCanWrite(){ return Net.ready&&!LB.denied&&netCanWrite(); }

// checks everything about a document that can be checked without playing it
function lbShape(id,x){
  if(typeof id!=='string'||!id||!x||typeof x!=='object') return null;
  const score=x.score, seed=x.seed, ts=x.ts, n=x.n, mv=x.mv;
  if(!Number.isInteger(score)||score<=0||score>1e9) return null;
  if(!Number.isInteger(seed)||seed<0||seed>=4294967296) return null;
  if(!Number.isInteger(ts)||ts<1.7e12||ts>Date.now()+864e5) return null;
  if(x.rv!==Logic.RULES_V) return null;
  if(typeof mv!=='string'||!Number.isInteger(n)||n<1||n>LB_MAX_MOVES||mv.length!==2*n) return null;
  if(Logic.seedFor(id,ts)!==seed) return null;
  return {id:id,score:score,seed:seed,ts:ts,n:n,mv:mv,name:cleanName(x.name)||t('player')};
}
function lbHash(s){
  let h=0x811c9dc5;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193); }
  return (h>>>0).toString(36);
}
function lbKey(r){ return r.id+'|'+r.score+'|'+r.seed+'|'+r.n+'|'+lbHash(r.mv); }
function lbCache(){
  if(LB.disk) return LB.disk;
  let o={};
  try{ const x=JSON.parse(lsGet('tb.lbv')||'{}'); if(x&&typeof x==='object') o=x; }catch(e){}
  LB.disk=o; return o;
}
function lbCacheSave(){
  try{
    const o=lbCache(), keys=Object.keys(o);
    if(keys.length>150) keys.slice(0,keys.length-150).forEach(function(k){ delete o[k]; });
    lsSet('tb.lbv',JSON.stringify(o));
  }catch(e){}
}
// replays the run in small slices so the page stays responsive
async function lbVerifyRow(r,tok){
  const key=lbKey(r), mem=lbCache();
  if(mem[key]!==undefined) return {ok:true,peak:mem[key]|0};
  const rp=Logic.makeReplayer(r.seed,r.mv);
  for(;;){
    const st=rp.step(9);
    if(st.done){
      if(st.ok&&st.score===r.score&&st.moves===r.n){ mem[key]=st.peak|0; lbCacheSave(); return {ok:true,peak:st.peak|0}; }
      return {ok:false};
    }
    if(tok!==undefined&&tok!==LB.tok) return {ok:false,aborted:true};
    await new Promise(function(res){ setTimeout(res,0); });
  }
}

async function lbSubmitNow(force){
  if(!(await netInit())||!lbCanWrite()) return false;
  const b=P.bestRun;
  if(!(b.score>0)||LB.sending) return false;
  const name=lbName();
  if(!force&&b.score<=(P.lb.sent|0)&&P.lb.name===name) return false;
  if(Date.now()-LB.last<(force?2000:4000)) return false;
  const doc={name:name,score:b.score,seed:b.seed,ts:b.ts,n:b.n,mv:b.mv,rv:b.rv,upd:Date.now()};
  const row=lbShape(Net.uid,doc);
  if(!row) return false;                         // a run that does not belong to this account is not sent
  LB.sending=true; LB.last=Date.now();
  try{
    const v=await lbVerifyRow(row);              // never send what would not replay
    if(!v.ok) return false;
    await Net.db.doc('lb/'+Net.uid).set(doc);
    P.lb.sent=b.score; P.lb.name=name; P.lb.at=Date.now(); save();
    LB.rows=null;
    return true;
  }catch(e){
    if(e&&(e.code==='not_granted'||e.code==='revoked'||e.code==='capability_disabled'||e.code==='capability_removed'||e.code==='invalid_argument')) LB.denied=true;
    return false;
  }finally{ LB.sending=false; }
}
// now: send at once (end of a game); otherwise wait a few seconds so a burst of changes becomes one write
function lbSubmitSoon(now){
  clearTimeout(LB.sendT);
  if(!(P.bestRun.score|0)) return;
  if(now) lbSubmitNow(false);
  else LB.sendT=setTimeout(function(){ lbSubmitNow(false); },6000);
}
// Loads the best rows and shows only the ones that replay. onRows(rows) is called as rows are confirmed.
async function lbLoad(onRows){
  const tok=++LB.tok;
  if(!(await netInit())) return {state:'nodb'};
  let snap;
  try{ snap=await Net.db.collection('lb').orderBy('score','desc').limit(LB_FETCH).get(); }
  catch(e){ return {state:'err'}; }
  const cand=[];
  snap.docs.forEach(function(d){ const r=lbShape(d.id,d.data()); if(r) cand.push(r); });
  cand.sort(function(a,b){ return b.score-a.score||a.ts-b.ts; });
  const rows=[]; let bad=0;
  for(let k=0;k<cand.length&&rows.length<LB_SHOW;k++){
    const v=await lbVerifyRow(cand[k],tok);
    if(tok!==LB.tok) return {state:'stale'};
    if(!v.ok){ bad++; continue; }
    cand[k].peak=v.peak; rows.push(cand[k]);
    if(onRows) onRows(rows.slice());
  }
  LB.rows=rows;
  return {state:'ok',rows:rows,rejected:bad};
}

// ===== boot.js =====
// Start-up, global events and timers.
function unlockAudio(){
  if(!P) return;
  markGesture();
  ensureAudio();
  if(P.settings.music) Music.start();
}
function setFxMode(low){ root.classList.toggle('lowfx',!!low); }
function applyFx(){
  let reduce=false;
  try{ reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  setFxMode(reduce);
}
function applyProfileSettings(){
  root.classList.toggle('cb',!!P.settings.cb);
  LANG=P.settings.lang||detectLang();
  applyI18n(document);
  slots.forEach(function(s,i){ s.setAttribute('aria-label',t('piece')+' '+(i+1)); });
  board.setAttribute('aria-label',t('board_aria'));
  applyFx();
  applyVolumes();
}
function flushNow(){
  try{ if(R&&!R.over){ commitBest(R); persistRun(); } }catch(e){}
  if(P){ save(); cloudPush(); lbSubmitSoon(true); }
}

function tick1s(){
  if(document.hidden||curView!=='game'||!R||R.over||modalOpen||R.mode==='tut') return;
  R.sec++; P.stats.sec++;
  if(R.mode==='zen'){ P.stats.zenSec=(P.stats.zenSec|0)+1; updateSide(); }
  if(P.stats.sec%20===0) save();
}

// a failure anywhere must never wipe the progress or freeze the page
window.addEventListener('error',function(e){ try{ oops(e); }catch(_){} });
window.addEventListener('unhandledrejection',function(e){ try{ oops(e); }catch(_){} });

async function boot(){
  if(NATIVE){ await nativeRestore(); document.documentElement.classList.add('native'); }
  loadProfile();
  applyProfileSettings();
  fillIcons(document);
  sizeFx();
  syncBackground();
  const debug=location.hash.indexOf('debug')>=0;
  // the textures are drawn once at start-up (about a second on a phone); the intro covers it
  let introDone=null;
  if(location.hash==='#debug') Intro.skip();
  else{
    let ok; const ready=new Promise(function(r){ ok=r; });
    introDone=Intro.run(ready); boot.ready=ok;
  }
  await new Promise(function(r){ setTimeout(r,30); });
  try{ await Mat.install(); }catch(e){}
  if(boot.ready) boot.ready();
  window.addEventListener('resize',layout);
  window.addEventListener('orientationchange',function(){ setTimeout(layout,200); });
  ['pointerdown','pointerup','touchend','keydown'].forEach(function(ev){ document.addEventListener(ev,unlockAudio,{passive:true}); });
  document.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ flushNow(); audioPause(); }
    else audioResume();
  });
  try{   // Telegram on desktop does not always report a minimised window as "hidden"
    const TW=window.Telegram&&Telegram.WebApp;
    if(window.TGX&&TGX.on&&TW&&TW.onEvent){
      TW.onEvent('deactivated',function(){ flushNow(); audioPause(); });
      TW.onEvent('activated',function(){ audioResume(); });
    }
  }catch(e){}
  window.addEventListener('pagehide',flushNow);
  setInterval(tick1s,1000);
  setInterval(neonTick,430);
  setInterval(function(){ if(P) save(); },45000);
  cloudInit(function(){
    applyProfileSettings();
    syncBackground();
    if(R&&R.mode==='tut'&&P.tut){ leaveGame(); showView('home'); }
    else if(curView==='home') renderHome();
  });
  const hot=window.claude&&window.claude.hot;
  if(hot&&hot.snapshot){ try{ hot.snapshot(function(){ flushNow(); return {}; }); }catch(e){} }
  if(!P.tut) startTutorial(); else showView('home');
  if(NATIVE){
    // The store build has no online leaderboard (that needs a server of your own), so its button is hidden.
    const lbb=$('m-lb'); if(lbb) lbb.hidden=true;
    // Android's back button: close a sheet, pause a game, leave to the menu, and only then quit.
    const app=capPlugin('App');
    if(app&&app.addListener){
      try{
        app.addListener('backButton',function(){
          if(!modal2El.hidden){ closeConfirm(); return; }
          if(!modalEl.hidden){ closeModal(); return; }
          if(curView==='game'&&R&&!R.over&&R.mode!=='tut'){ openPause(); return; }
          if(curView==='game'){ goHome(); return; }
          flushNow(); try{ app.exitApp(); }catch(e){}
        });
        app.addListener('pause',function(){ flushNow(); });
      }catch(e){}
    }
  }
  if(debug){
    window.BB={Logic:Logic,Mat:Mat,P:function(){ return P; },R:function(){ return R; },startRun:startRun,mkRun:mkRun,startMode:startMode,startTutorial:startTutorial,TUT:TUT,
      showView:showView,commitMove:commitMove,failRun:failRun,cells:cells,layout:layout,toast:toast,openPause:openPause,setBackground:setBackground,setComboLabel:setComboLabel,STR:STR,pokeCell:pokeCell,
      busy:function(){ return busy; },goHome:goHome,openSettings:openSettings,openProfile:openProfile,openHelp:openHelp,openLeaderboard:openLeaderboard,introDone:introDone,
      setLang:setLang,Cloud:Cloud,Net:Net,LB:LB,restoreRun:restoreRun,serializeRun:serializeRun,save:save,DBG:DBG,genTray:genTray,renderTray:renderTray,
      STR:STR,forcePaint:forcePaint,updateHUD:updateHUD,onTier:onTier,checkScoreEvents:checkScoreEvents,lbSubmitNow:lbSubmitNow,sfx:sfx,
      // test helpers: a run touched this way is never a leaderboard run
      setScore:function(n){ const prev=R.score; R.elig=false; R.score=n; checkScoreEvents(R,prev); updateHUD(false); },
      setGrid:function(g){ R.elig=false; R.grid=g; forcePaint(g); },
      setTray:function(list){ R.elig=false; R.tray=list; renderTray(true); updateHUD(false); },
      streakTouch:streakTouch,streakNow:streakNow,openStreak:function(){ return openStreak(); },lbVerifyRow:function(id,d){ return lbVerifyRow(id,d); }};
  }
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready){
  window.claude.hot.ready(function(){ boot(); });
}else boot();

})();
</script>
